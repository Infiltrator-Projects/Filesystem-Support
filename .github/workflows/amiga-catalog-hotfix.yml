name: Complete Amiga catalogue release fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/amiga-catalog-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch catalogue, tests, matrix and version
        shell: python
        run: |
          from pathlib import Path
          import re

          catalog = Path('src/catalog.cpp')
          text = catalog.read_text()
          start_marker = '        {"sfs", "Amiga SFS", "Amiga",'
          end_marker = '        {"befs", "BeOS BeFS", "BeOS / Haiku",'
          start = text.find(start_marker)
          end = text.find(end_marker, start + 1)
          if start < 0 or end < 0:
              raise SystemExit('catalogue Amiga insertion point not found')
          amiga = '''        {"sfs", "Amiga SFS", "Amiga",
           "Amiga Smart File System as an independent native Linux module.",
           {"sfs"}, {}, AccessMode::ReadWrite, SupportProvider::Kernel,"Project-native Linux SFS module implementing the SFS on-disk format.", true},
          {"sfs2", "Amiga SFS2", "Amiga",
           "Amiga Smart File System 2 as an independent native Linux module.",
           {"sfs2"}, {}, AccessMode::ReadWrite, SupportProvider::Kernel,"Project-native Linux SFS2 module implementing the SFS2 on-disk format independently.", true},
          {"pfs3", "Amiga PFS3", "Amiga",
           "Amiga Professional File System 3 support through the project-native Linux adapter.",
           {"pfs3"}, {}, AccessMode::ReadOnly, SupportProvider::Kernel,"Project-native PFS3 adapter is intentionally read-only until writable metadata updates are fully qualified.", true},
          '''
          catalog.write_text(text[:start] + amiga + text[end:])

          test = Path('tests/catalog_test.cpp')
          text = test.read_text()
          required = [
              'catalog().size() != 107U',
              'catalogue size is not the documented 107 entries',
              '    bool found_sfs = false;\n',
              'kernel_only != 22U',
              '    if (argc != 2) {'
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f'catalog test marker missing: {needle!r}')
          text = text.replace('catalog().size() != 107U', 'catalog().size() != 109U', 1)
          text = text.replace('catalogue size is not the documented 107 entries', 'catalogue size is not the documented 109 entries', 1)
          text = text.replace('    bool found_sfs = false;\n', '    bool found_sfs = false;\n    bool found_sfs2 = false;\n    bool found_pfs3 = false;\n', 1)
          loop = '    for (const auto& entry : catalog()) {\n'
          text = text.replace(loop, loop + '''        if (entry.id == std::string_view("sfs2")) {
              found_sfs2 = true;
          } else if (entry.id == std::string_view("pfs3")) {
              found_pfs3 = true;
          }

          ''', 1)
          text = text.replace('if (!found_ofs || !found_ffs || !found_sfs || !found_adfs)', 'if (!found_ofs || !found_ffs || !found_sfs || !found_sfs2 || !found_pfs3 || !found_adfs)', 1)
          text = text.replace('kernel_only != 22U', 'kernel_only != 24U', 1)
          marker = '    if (argc != 2) {'
          extra = '''    if (!filesystem_support::module_is_catalogued("sfs2") ||
              !filesystem_support::module_is_catalogued("pfs3") ||
              !filesystem_support::linux_native_module_is_managed("sfs2", "sfs2") ||
              !filesystem_support::linux_native_module_is_managed("pfs3", "pfs3")) {
              return fail("SFS2/PFS3 project-native catalogue coverage is incomplete");
          }

          '''
          text = text.replace(marker, extra + marker, 1)
          test.write_text(text)

          matrix = Path('docs/FILESYSTEM_SUPPORT_MATRIX.md')
          lines = matrix.read_text().splitlines()
          lines = [line.replace('mirrors the 107 entries', 'mirrors the 109 entries').replace('**Catalogue entries:** 107', '**Catalogue entries:** 109') for line in lines]
          lines = [line.rstrip() if line.startswith('**Catalogue entries:**') else line for line in lines]
          out = []
          inserted = False
          row_re = re.compile(r'^\| (\d+) \|')
          for line in lines:
              m = row_re.match(line)
              if m and int(m.group(1)) >= 29:
                  line = row_re.sub(f'| {int(m.group(1)) + 2} |', line, count=1)
              out.append(line)
              if 'id="support-sfs"' in line:
                  out.append('| 29 | <a id="support-sfs2"></a>`sfs2` | Amiga SFS2 | Amiga | Read / write | Project-native kernel | `sfs2` | — | Independent Infiltrator SFS2 module. Install/Remove builds and manages `sfs2.ko` for the running kernel. |')
                  out.append('| 30 | <a id="support-pfs3"></a>`pfs3` | Amiga PFS3 | Amiga | Read-only | Project-native kernel | `pfs3` | — | Independent Infiltrator PFS3 adapter. The current qualified Linux implementation is deliberately read-only. |')
                  inserted = True
          if not inserted:
              raise SystemExit('support matrix SFS row not found')
          matrix.write_text('\n'.join(out) + '\n')

          version = Path('VERSION')
          if version.read_text().strip() != '0.5.2':
              raise SystemExit('unexpected VERSION before release bump')
          version.write_text('0.5.3\n')

          release = Path('.github/workflows/release.yml')
          rtext = release.read_text()
          rtext = rtext.replace('107 filesystem', '109 filesystem').replace('108 filesystem', '109 filesystem')
          release.write_text(rtext)

      - name: Remove one-shot workflow and commit final release state
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/amiga-catalog-hotfix.yml
          git config user.name 'The-First-Infiltrator'
          git config user.email 'infiltratr@yandex.com'
          git add src/catalog.cpp tests/catalog_test.cpp docs/FILESYSTEM_SUPPORT_MATRIX.md VERSION .github/workflows/release.yml
          git diff --cached --check
          git commit -m 'Complete Amiga catalogue and prepare 0.5.3'
          git push origin HEAD:main
