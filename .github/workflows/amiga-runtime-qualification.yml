name: Amiga runtime qualification

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "data/native-filesystems.tsv"
      - "data/desktop-filesystems.tsv"
      - "cmake/amiga-desktop-detection.cmake"
      - "native/filesystems/ofs/**"
      - "native/filesystems/ffs/**"
      - "native/filesystems/sfs/**"
      - "native/filesystems/sfs2/**"
      - "native/filesystems/pfs3/**"
      - "packaging/linux/native-module-helper.sh"
      - "packaging/linux/kernel-module-helper.sh"
      - "packaging/linux/desktop-integration.sh"
      - "packaging/linux/gnome-disks-wrapper"
      - "packaging/linux/nemo-wrapper"
      - "packaging/linux/desktop-rules/**"
      - "tests/amiga_runtime_init.sh"
      - "tests/desktop_install_test.py"
      - "tools/generate-sfs-runtime-images.py"
      - ".github/workflows/amiga-runtime-qualification.yml"
  workflow_dispatch:

concurrency:
  group: filesystem-support-amiga-runtime-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Decide whether Amiga runtime qualification is required
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" || \
                "${{ github.event_name }}" == "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subject=$(git log -1 --format=%s)
          if [[ "$subject" == Release\ * ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse HEAD^ >/dev/null 2>&1 &&
             git diff --quiet HEAD^ HEAD -- \
               CMakeLists.txt \
               data/native-filesystems.tsv \
               data/desktop-filesystems.tsv \
               cmake/amiga-desktop-detection.cmake \
               native/filesystems/ofs \
               native/filesystems/ffs \
               native/filesystems/sfs \
               native/filesystems/sfs2 \
               native/filesystems/pfs3 \
               packaging/linux/native-module-helper.sh \
               packaging/linux/kernel-module-helper.sh \
               packaging/linux/desktop-integration.sh \
               packaging/linux/gnome-disks-wrapper \
               packaging/linux/nemo-wrapper \
               packaging/linux/desktop-rules \
               tests/amiga_runtime_init.sh \
               tests/desktop_install_test.py \
               tools/generate-sfs-runtime-images.py \
               .github/workflows/amiga-runtime-qualification.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  linux-amiga-runtime:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Filesystem Support
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install qualification dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libelf-dev libssl-dev cpio qemu-system-x86 \
            busybox-static cmake ninja-build pkg-config libgtk-3-dev libext2fs-dev

      - name: Build pinned kernel without host AFFS
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v6.12.107 https://github.com/gregkh/linux.git /tmp/linux
          make -C /tmp/linux defconfig
          /tmp/linux/scripts/config --file /tmp/linux/.config \
            --disable AFFS_FS \
            --enable BLK_DEV_INITRD \
            --enable DEVTMPFS \
            --enable DEVTMPFS_MOUNT \
            --enable VIRTIO \
            --enable VIRTIO_PCI \
            --enable VIRTIO_BLK \
            --enable SERIAL_8250 \
            --enable SERIAL_8250_CONSOLE \
            --enable TMPFS
          make -C /tmp/linux olddefconfig
          make -C /tmp/linux -j"$(nproc)" bzImage modules

      - name: Build project Amiga modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r fs desktop_variant; do
            [[ -n "$fs" && "$fs" != \#* ]] || continue
            module=$(awk -F '\t' -v fs="$fs" '
              $0 !~ /^#/ && NF == 2 && $1 == fs { print $2; found = 1; exit }
              END { if (!found) exit 1 }
            ' data/native-filesystems.tsv)
            [[ -n "$module" ]]
            make -C /tmp/linux M="$PWD/native/filesystems/$fs/linux" modules
            test -s "native/filesystems/$fs/linux/$module.ko"
          done < data/desktop-filesystems.tsv

      - name: Build independent OFS FFS and PFS3 fixture generators
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Infiltrator-Projects/Defragmenter.git /tmp/defragger
          git -C /tmp/defragger checkout c57f94fcc242a77170cb4175835222cab8f5c17c
          git -C /tmp/defragger submodule update --init --recursive
          cmake -S /tmp/defragger/defragger -B /tmp/defrag-build \
            -G Ninja -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/defrag-build --target \
            linux-defragger-test-media-mkfs-ofs \
            linux-defragger-test-media-mkfs-ffs \
            linux-defragger-pfs3-native-test

      - name: Manufacture independent Amiga media
        shell: bash
        run: |
          set -euo pipefail
          truncate -s 32M /tmp/ofs.img
          truncate -s 32M /tmp/ffs.img
          /tmp/defrag-build/test-media-mkfs-ofs /tmp/ofs.img
          /tmp/defrag-build/test-media-mkfs-ffs /tmp/ffs.img
          python3 tools/generate-sfs-runtime-images.py \
            --variant sfs --output /tmp/sfs.img --blocks 4096 --volume RuntimeSFS
          python3 tools/generate-sfs-runtime-images.py \
            --variant sfs2 --output /tmp/sfs2.img --blocks 4096 --volume RuntimeSFS2
          /tmp/defrag-build/linux-defragger-pfs3-native-test \
            --write-fixture /tmp/pfs3.img fragmented
          test -s /tmp/ofs.img
          test -s /tmp/ffs.img
          test -s /tmp/sfs.img
          test -s /tmp/sfs2.img
          test -s /tmp/pfs3.img

      - name: Build qualification initramfs
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/amiga-root
          rm -rf "$root"
          mkdir -p "$root"/{bin,etc,proc,sys,dev,mnt/ofs,mnt/ffs,mnt/sfs,mnt/sfs2,mnt/pfs3}
          cp /usr/bin/busybox "$root/bin/busybox"
          for app in sh mount umount mkdir rmdir cat echo dd ln mv rm readlink sync poweroff reboot stat wc insmod su id test; do
            ln -s busybox "$root/bin/$app"
          done
          while IFS=$'\t' read -r fs desktop_variant; do
            [[ -n "$fs" && "$fs" != \#* ]] || continue
            module=$(awk -F '\t' -v fs="$fs" '
              $0 !~ /^#/ && NF == 2 && $1 == fs { print $2; found = 1; exit }
              END { if (!found) exit 1 }
            ' data/native-filesystems.tsv)
            [[ -n "$module" ]]
            cp "native/filesystems/$fs/linux/$module.ko" "$root/$module.ko"
          done < data/desktop-filesystems.tsv
          printf 'root:x:0:0:root:/:/bin/sh\ndesktop:x:1000:1000:desktop:/:/bin/sh\nother:x:1001:1001:other:/:/bin/sh\n' > "$root/etc/passwd"
          printf 'root:x:0:\ndesktop:x:1000:\nother:x:1001:\n' > "$root/etc/group"
          python3 - "$root" <<'PY'
          from pathlib import Path
          import re
          import sys
          root=Path(sys.argv[1])
          for fs in ('ofs','ffs','sfs','sfs2'):
              rule=Path(f'packaging/linux/desktop-rules/{fs}.rules').read_text()
              options=re.findall(r'ENV\{UDISKS_MOUNT_OPTIONS_DEFAULTS\}="([^"\n]+)"',rule)[-1]
              options=options.replace('$$UID','1000').replace('$$GID','1000')
              assert '$' not in options, (fs, options)
              (root/f'{fs}.mount-options').write_text(options+'\n')
          PY
          install -m 0755 tests/amiga_runtime_init.sh "$root/init"
          (cd "$root" && find . -print0 | cpio --null -ov --format=newc | gzip -9) \
            > /tmp/amiga-initramfs.cpio.gz

      - name: Boot, exercise and recover real Amiga media
        shell: bash
        run: |
          set -euo pipefail
          timeout 360 qemu-system-x86_64 \
            -machine accel=tcg \
            -m 768 \
            -nographic \
            -kernel /tmp/linux/arch/x86/boot/bzImage \
            -initrd /tmp/amiga-initramfs.cpio.gz \
            -append 'console=ttyS0 panic=1 rdinit=/init' \
            -drive file=/tmp/ofs.img,format=raw,if=virtio \
            -drive file=/tmp/ffs.img,format=raw,if=virtio \
            -drive file=/tmp/sfs.img,format=raw,if=virtio \
            -drive file=/tmp/sfs2.img,format=raw,if=virtio \
            -drive file=/tmp/pfs3.img,format=raw,if=virtio \
            2>&1 | tee /tmp/amiga-runtime.log
          grep -Fq 'AMIGA-CRASH-ARMED' /tmp/amiga-runtime.log
          for fs in ofs ffs sfs sfs2; do
            grep -Fq "AMIGA-CRASH-RECOVERY-PASS: $fs" /tmp/amiga-runtime.log
          done
          grep -Fq 'AMIGA-RUNTIME-PASS' /tmp/amiga-runtime.log
          ! grep -Fq 'AMIGA-RUNTIME-FAIL' /tmp/amiga-runtime.log

      - name: Preserve Amiga runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amiga-runtime-log
          path: /tmp/amiga-runtime.log
          if-no-files-found: warn
