# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish to central APT repository

on:
  workflow_run:
    workflows: ["EXT runtime qualification"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: filesystem-support-apt-publication-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish-apt:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      APP_ID: filesystem-support
    steps:
      - name: Check out exact qualified release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Wait for exact GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$VERSION"

          for attempt in $(seq 1 120); do
            if release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null)"; then
              target="$(jq -r '.target_commitish // empty' <<<"$release_json")"
              if [[ "$target" == "$EXPECTED_SHA" ]]; then
                echo "GitHub release $tag is published for $EXPECTED_SHA."
                exit 0
              fi
              echo "Release $tag exists but targets $target, expected $EXPECTED_SHA." >&2
              exit 1
            fi
            echo "Waiting for GitHub release $tag ($attempt/120)..."
            sleep 5
          done

          echo "GitHub release $tag was not published within 10 minutes." >&2
          exit 1

      - name: Trigger and verify central APT publication
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          payload="$(jq -nc \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg sha "$RELEASE_SHA" \
            '{event_type:"application-release",client_payload:{repository:$repository,sha:$sha}}')"

          dispatched=false
          if [[ -n "${DISPATCH_TOKEN:-}" ]]; then
            if curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $DISPATCH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "$payload" \
              https://api.github.com/repos/Infiltrator-Projects/Infiltrator-Repository/dispatches; then
              echo "Immediate APT dispatch accepted; verifying publication."
              dispatched=true
            else
              echo "::warning::Immediate APT dispatch failed; waiting for the central scheduled publisher."
            fi
          else
            echo "::warning::APT dispatch token unavailable; waiting for the central scheduled publisher."
          fi

          catalogue='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'

          if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA&attempt=0" \
            | jq -e --arg id "$APP_ID" --arg version "$VERSION" \
              '.[] | select(.id == $id and .version == $version)' >/dev/null; then
            echo "APT repository already advertises $APP_ID $VERSION."
            exit 0
          fi

          if [[ "$dispatched" != true ]]; then
            echo "Immediate APT dispatch unavailable; waiting for central repository publication."
          fi

          for attempt in $(seq 1 120); do
            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA&attempt=$attempt" \
              | jq -e --arg id "$APP_ID" --arg version "$VERSION" \
                '.[] | select(.id == $id and .version == $version)' >/dev/null; then
              echo "APT repository advertises $APP_ID $VERSION."
              exit 0
            fi
            echo "Waiting for APT publication of $APP_ID $VERSION ($attempt/120)..."
            sleep 10
          done

          echo "::error::Central APT repository did not advertise $APP_ID $VERSION within 20 minutes."
          exit 1
