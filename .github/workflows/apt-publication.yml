# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish to central APT repository

on:
  workflow_run:
    workflows: ["build"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: filesystems-apt-publication-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish-apt:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      APP_ID: filesystems
    steps:
      - name: Check out exact completed build source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Resolve exact published release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"

          if ! release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" 2>/dev/null); then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No GitHub release exists for $tag at this completed build; APT publication is not applicable."
            exit 0
          fi

          target=$(jq -r '.target_commitish // empty' <<<"$release_json")
          if [[ "$target" != "$EXPECTED_SHA" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag targets $target, not completed build $EXPECTED_SHA; APT publication is not applicable."
            exit 0
          fi

          expected=$(printf '%s\n%s\n%s\n' \
            "Filesystems-$version-amd64.deb" \
            "Filesystems-$version-amd64.run" \
            RELEASE_SHA256SUMS.txt | sort)
          actual=$(jq -r '.assets[].name' <<<"$release_json" | sort)
          test "$actual" = "$expected" || {
            echo "Release $tag does not contain the exact qualified asset set." >&2
            exit 1
          }

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Request central APT publication
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          catalogue='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'

          # The central repository is the sole publication authority. If it has
          # already consumed this exact release, there is nothing to request.
          if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA" \
            | jq -e --arg id "$APP_ID" --arg version "$version" --arg sha "$RELEASE_SHA" \
              '.[] | select(.id == $id and .version == $version and .release_sha == $sha)' >/dev/null; then
            echo "Central APT already advertises exact release $APP_ID $version ($RELEASE_SHA)."
            exit 0
          fi

          if [[ -n "${GH_TOKEN:-}" ]]; then
            payload=$(jq -nc \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg sha "$RELEASE_SHA" \
              '{event_type:"application-release",client_payload:{repository:$repository,sha:$sha}}')
            if gh api --method POST \
              repos/Infiltrator-Projects/Infiltrator-Repository/dispatches \
              --input - <<<"$payload"; then
              echo "Central APT publication request accepted for $APP_ID $version ($RELEASE_SHA)."
              exit 0
            fi
            echo "::warning::Immediate APT dispatch failed; the central scheduled publisher remains authoritative."
          else
            echo "Immediate APT dispatch token unavailable; the central scheduled publisher remains authoritative."
          fi

          # Do not turn GitHub scheduler latency into a source-repository build
          # failure. The central publisher discovers releases independently and
          # validates exact artefact bytes before publishing them.
          echo "Release $APP_ID $version is eligible for asynchronous central APT publication."
