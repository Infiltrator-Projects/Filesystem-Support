name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # v2 rotates away from a stale cancelled run that remained attached to
  # self-hosted runners.  Future pushes still cancel superseded work on main.
  group: filesystem-support-build-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    runs-on: ${{ startsWith(github.event.head_commit.message, 'Release ') && 'ubuntu-24.04' || 'linux-native' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce immutable source version identity
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "VERSION must contain major.minor.patch." >&2
            exit 1
          }

          tag_refs=$(git ls-remote --tags origin \
            "refs/tags/v${version}" "refs/tags/v${version}^{}")
          if [[ -n "$tag_refs" ]]; then
            tag_commit=$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<<"$tag_refs" | tail -n1)
            if [[ -z "$tag_commit" ]]; then
              tag_commit=$(awk 'NR == 1 { print $1 }' <<<"$tag_refs")
            fi
            head_commit=$(git rev-parse HEAD)
            if [[ "$tag_commit" != "$head_commit" ]]; then
              printf 'Source version %s is already tagged at %s; current main is %s. Advance VERSION before further development.\n' \
                "$version" "$tag_commit" "$head_commit" >&2
              exit 1
            fi
          fi

      - name: Enforce rewrite boundaries
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/shape-ext2.sh
          test ! -e tools/shape-ext3.sh
          test ! -e tools/shape-ext4.sh
          test ! -e tools/harden-ext-ranges.py

          # Every filesystem that has been structurally reviewed carries a
          # design/ownership document at its filesystem root. Reference-state
          # filesystems use that document to make clear that imported source is
          # evidence, not a project-authored implementation.
          for fs in 9p adfs afuse apfs-dkms apfs-fuse archivemount avfs bcachefs befs bfs bindfs bitlocker btrfs ceph-fuse cephfs cifs convmvfs cpm cramfs cryfs curlftpfs davfs2 disorderfs ecryptfs efs encfs erofs erofsfuse exfat exfat-fuse ext2 ext3 ext4 f2fs fat ffs filevault fosfat fscrypt fuse-overlayfs fuse2fs fusefat fuseiso fusezip gfs2 glusterfs go-mtpfs gocryptfs gphotofs guestmount gvfs-fuse hfs ofs pfs3 sfs sfs2; do
            test -s "native/filesystems/$fs/DESIGN.md"
          done

          # 9P is a high-level remote filesystem protocol. Its copied Linux
          # V9FS source is reference evidence and must never masquerade as the
          # project's canonical implementation or a Filesystem Support .ko.
          test -s native/filesystems/9p/DESIGN.md
          test -d native/filesystems/9p/reference/linux
          for forbidden in core userspace linux windows kernel; do
            test ! -e "native/filesystems/9p/$forbidden"
          done
          while IFS= read -r entry; do
            case "$entry" in
              DESIGN.md|reference) ;;
              *)
                echo "Unexpected 9P root entry while still in reference/import state: $entry" >&2
                exit 1
                ;;
            esac
          done < <(find native/filesystems/9p -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test -s native/filesystems/9p/reference/linux/v9fs.c
          test -s native/filesystems/9p/reference/linux/vfs_inode.c
          while IFS= read -r source_file; do
            grep -Fq 'SPDX-License-Identifier:' "$source_file" || {
              echo "9P reference provenance marker missing: $source_file" >&2
              exit 1
            }
          done < <(find native/filesystems/9p/reference/linux -type f \
                    \( -name '*.c' -o -name '*.h' \) -print | sort)
          ! grep -Fq 'native/filesystems/9p/reference' CMakeLists.txt

          # ADFS is a conventional local filesystem, but it has not crossed
          # the project-authorship boundary. Keep copied Linux source solely
          # under reference/linux until an independent core/adapter rewrite.
          test -s native/filesystems/adfs/DESIGN.md
          test -d native/filesystems/adfs/reference/linux
          for forbidden in core linux windows kernel; do
            test ! -e "native/filesystems/adfs/$forbidden"
          done
          while IFS= read -r entry; do
            case "$entry" in
              DESIGN.md|reference) ;;
              *)
                echo "Unexpected ADFS root entry while still in reference/import state: $entry" >&2
                exit 1
                ;;
            esac
          done < <(find native/filesystems/adfs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test -s native/filesystems/adfs/reference/linux/adfs.h
          test -s native/filesystems/adfs/reference/linux/map.c
          while IFS= read -r source_file; do
            grep -Fq 'SPDX-License-Identifier:' "$source_file" || {
              echo "ADFS reference provenance marker missing: $source_file" >&2
              exit 1
            }
          done < <(find native/filesystems/adfs/reference/linux -type f \
                    \( -name '*.c' -o -name '*.h' \) -print | sort)
          ! grep -Fq 'native/filesystems/adfs/reference' CMakeLists.txt

          # AFUSE is currently an external userspace-provider catalogue entry,
          # not a first-party filesystem implementation. Until an explicit
          # product decision promotes it, DESIGN.md is the complete directory.
          test -s native/filesystems/afuse/DESIGN.md
          for forbidden in .gitkeep core userspace linux windows kernel reference; do
            test ! -e "native/filesystems/afuse/$forbidden"
          done
          while IFS= read -r entry; do
            test "$entry" = "DESIGN.md" || {
              echo "Unexpected AFUSE entry before first-party promotion: $entry" >&2
              exit 1
            }
          done < <(find native/filesystems/afuse -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # APFS-DKMS is an external Debian provider identity, not a second
          # APFS implementation owned by this source tree. Its filesystem
          # directory is documentation-only until that contract changes.
          test -s native/filesystems/apfs-dkms/DESIGN.md
          for forbidden in .gitkeep core userspace linux windows kernel reference; do
            test ! -e "native/filesystems/apfs-dkms/$forbidden"
          done
          while IFS= read -r entry; do
            test "$entry" = "DESIGN.md" || {
              echo "Unexpected APFS-DKMS implementation entry: $entry" >&2
              exit 1
            }
          done < <(find native/filesystems/apfs-dkms -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # APFS-FUSE is another external provider identity for the same APFS
          # filesystem, not a second place to implement APFS semantics. Its
          # filesystem directory remains documentation-only.
          test -s native/filesystems/apfs-fuse/DESIGN.md
          for forbidden in .gitkeep core userspace linux windows kernel reference; do
            test ! -e "native/filesystems/apfs-fuse/$forbidden"
          done
          while IFS= read -r entry; do
            test "$entry" = "DESIGN.md" || {
              echo "Unexpected APFS-FUSE implementation entry: $entry" >&2
              exit 1
            }
          done < <(find native/filesystems/apfs-fuse -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # ArchiveMount is currently an external userspace archive provider,
          # not a first-party implementation. Until promotion, DESIGN.md is
          # the complete filesystem directory.
          test -s native/filesystems/archivemount/DESIGN.md
          for forbidden in .gitkeep core userspace linux windows kernel reference; do
            test ! -e "native/filesystems/archivemount/$forbidden"
          done
          while IFS= read -r entry; do
            test "$entry" = "DESIGN.md" || {
              echo "Unexpected ArchiveMount implementation entry: $entry" >&2
              exit 1
            }
          done < <(find native/filesystems/archivemount -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # AVFS is currently an external userspace virtual-filesystem provider,
          # not a first-party implementation. Until promotion, DESIGN.md is
          # the complete filesystem directory.
          test -s native/filesystems/avfs/DESIGN.md
          for forbidden in .gitkeep core userspace linux windows kernel reference; do
            test ! -e "native/filesystems/avfs/$forbidden"
          done
          while IFS= read -r entry; do
            test "$entry" = "DESIGN.md" || {
              echo "Unexpected AVFS implementation entry: $entry" >&2
              exit 1
            }
          done < <(find native/filesystems/avfs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # Bcachefs remains imported reference evidence until an independent
          # canonical engine and thin OS adapters are written.
          test -s native/filesystems/bcachefs/DESIGN.md
          test -d native/filesystems/bcachefs/reference/linux
          for forbidden in core linux windows kernel userspace; do
            test ! -e "native/filesystems/bcachefs/$forbidden"
          done
          while IFS= read -r entry; do
            case "$entry" in
              DESIGN.md|reference) ;;
              *)
                echo "Unexpected Bcachefs root entry while still in reference/import state: $entry" >&2
                exit 1
                ;;
            esac
          done < <(find native/filesystems/bcachefs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test -s native/filesystems/bcachefs/reference/linux/bcachefs_format.h
          test -s native/filesystems/bcachefs/reference/linux/btree_io.c
          test -s native/filesystems/bcachefs/reference/linux/journal.c
          test -s native/filesystems/bcachefs/reference/linux/snapshot.c
          ! grep -Fq 'native/filesystems/bcachefs/reference' CMakeLists.txt

          # BeFS remains copied Linux reference source until an independent
          # host-neutral implementation is written.
          test -s native/filesystems/befs/DESIGN.md
          test -d native/filesystems/befs/reference/linux
          for forbidden in core linux windows userspace kernel; do
            test ! -e "native/filesystems/befs/$forbidden"
          done
          while IFS= read -r entry; do
            case "$entry" in
              DESIGN.md|reference) ;;
              *)
                echo "Unexpected BeFS root entry while still in reference/import state: $entry" >&2
                exit 1
                ;;
            esac
          done < <(find native/filesystems/befs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test -s native/filesystems/befs/reference/linux/befs_fs_types.h
          test -s native/filesystems/befs/reference/linux/btree.c
          test -s native/filesystems/befs/reference/linux/datastream.c
          test -s native/filesystems/befs/reference/linux/linuxvfs.c
          ! grep -Fq 'native/filesystems/befs/reference' CMakeLists.txt

          # SCO BFS remains copied Linux reference source until independently
          # rewritten into a canonical engine plus host adapters.
          test -s native/filesystems/bfs/DESIGN.md
          test -d native/filesystems/bfs/reference/linux
          for forbidden in core linux windows userspace kernel; do
            test ! -e "native/filesystems/bfs/$forbidden"
          done
          while IFS= read -r entry; do
            case "$entry" in
              DESIGN.md|reference) ;;
              *)
                echo "Unexpected BFS root entry while still in reference/import state: $entry" >&2
                exit 1
                ;;
            esac
          done < <(find native/filesystems/bfs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test -s native/filesystems/bfs/reference/linux/bfs.h
          test -s native/filesystems/bfs/reference/linux/dir.c
          test -s native/filesystems/bfs/reference/linux/file.c
          test -s native/filesystems/bfs/reference/linux/inode.c
          ! grep -Fq 'native/filesystems/bfs/reference' CMakeLists.txt

          # bindfs is currently an external userspace overlay/presentation
          # provider. Until a first-party userspace implementation is admitted,
          # DESIGN.md is the complete filesystem directory.
          test -s native/filesystems/bindfs/DESIGN.md
          for forbidden in .gitkeep core userspace linux windows kernel reference; do
            test ! -e "native/filesystems/bindfs/$forbidden"
          done
          while IFS= read -r entry; do
            test "$entry" = "DESIGN.md" || {
              echo "Unexpected bindfs implementation entry: $entry" >&2
              exit 1
            }
          done < <(find native/filesystems/bindfs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # BitLocker is currently an external container/encryption provider,
          # not a first-party implementation. A future core/userspace pair is
          # valid only after explicit promotion; kernel filesystem code is not.
          test -s native/filesystems/bitlocker/DESIGN.md
          for forbidden in .gitkeep core userspace linux windows kernel reference; do
            test ! -e "native/filesystems/bitlocker/$forbidden"
          done
          while IFS= read -r entry; do
            test "$entry" = "DESIGN.md" || {
              echo "Unexpected BitLocker implementation entry before promotion: $entry" >&2
              exit 1
            }
          done < <(find native/filesystems/bitlocker -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # Btrfs remains an imported Linux reference until independently
          # rewritten into the canonical engine/adapter architecture.
          test -s native/filesystems/btrfs/DESIGN.md
          test -d native/filesystems/btrfs/reference/linux
          for forbidden in core linux windows userspace kernel; do
            test ! -e "native/filesystems/btrfs/$forbidden"
          done
          while IFS= read -r entry; do
            case "$entry" in
              DESIGN.md|reference) ;;
              *)
                echo "Unexpected Btrfs root entry while still in reference/import state: $entry" >&2
                exit 1
                ;;
            esac
          done < <(find native/filesystems/btrfs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test -s native/filesystems/btrfs/reference/linux/ctree.c
          test -s native/filesystems/btrfs/reference/linux/inode.c
          test -s native/filesystems/btrfs/reference/linux/extent-tree.c
          test -s native/filesystems/btrfs/reference/linux/volumes.c
          ! grep -Fq 'native/filesystems/btrfs/reference' CMakeLists.txt

          # ceph-fuse is an external userspace provider for CephFS, not a
          # second CephFS semantic implementation. The provider directory is
          # documentation-only; canonical semantics belong under cephfs/.
          test -s native/filesystems/ceph-fuse/DESIGN.md
          for forbidden in .gitkeep core userspace linux windows kernel reference; do
            test ! -e "native/filesystems/ceph-fuse/$forbidden"
          done
          while IFS= read -r entry; do
            test "$entry" = "DESIGN.md" || {
              echo "Unexpected ceph-fuse implementation entry: $entry" >&2
              exit 1
            }
          done < <(find native/filesystems/ceph-fuse -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # CephFS is a distributed protocol/filesystem. The Linux kernel
          # client is reference evidence; project code targets the shared
          # userspace-service architecture.
          test -s native/filesystems/cephfs/DESIGN.md
          test -d native/filesystems/cephfs/reference/linux
          for forbidden in core userspace linux windows kernel; do
            test ! -e "native/filesystems/cephfs/$forbidden"
          done
          while IFS= read -r entry; do
            case "$entry" in
              DESIGN.md|reference) ;;
              *)
                echo "Unexpected CephFS root entry while still in reference/import state: $entry" >&2
                exit 1
                ;;
            esac
          done < <(find native/filesystems/cephfs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test -s native/filesystems/cephfs/reference/linux/mds_client.c
          test -s native/filesystems/cephfs/reference/linux/super.c
          test -s native/filesystems/cephfs/reference/linux/caps.c
          test -s native/filesystems/cephfs/reference/linux/inode.c
          ! grep -Fq 'native/filesystems/cephfs/reference' CMakeLists.txt

          # SMB/CIFS is a remote protocol/filesystem. Linux kernel source is
          # reference evidence; project semantics target the userspace core.
          test -s native/filesystems/cifs/DESIGN.md
          test -d native/filesystems/cifs/reference/linux/client
          test -d native/filesystems/cifs/reference/linux/common
          for forbidden in core userspace linux windows kernel; do
            test ! -e "native/filesystems/cifs/$forbidden"
          done
          while IFS= read -r entry; do
            case "$entry" in
              DESIGN.md|reference) ;;
              *)
                echo "Unexpected CIFS root entry while still in reference/import state: $entry" >&2
                exit 1
                ;;
            esac
          done < <(find native/filesystems/cifs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test -s native/filesystems/cifs/reference/linux/client/cifssmb.c
          test -s native/filesystems/cifs/reference/linux/client/smb2pdu.c
          test -s native/filesystems/cifs/reference/linux/common/smb2pdu.h
          ! grep -Fq 'native/filesystems/cifs/reference' CMakeLists.txt

          # ConvmvFS is currently an external userspace charset/presentation
          # overlay. Until a first-party userspace implementation is admitted,
          # DESIGN.md is the complete filesystem directory.
          test -s native/filesystems/convmvfs/DESIGN.md
          for forbidden in .gitkeep core userspace linux windows kernel reference; do
            test ! -e "native/filesystems/convmvfs/$forbidden"
          done
          while IFS= read -r entry; do
            test "$entry" = "DESIGN.md" || {
              echo "Unexpected ConvmvFS implementation entry: $entry" >&2
              exit 1
            }
          done < <(find native/filesystems/convmvfs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # CP/M is a real disk-format family, but it has not entered
          # first-party implementation yet. Until promotion, DESIGN.md is the
          # complete filesystem directory.
          test -s native/filesystems/cpm/DESIGN.md
          for forbidden in .gitkeep core linux windows userspace kernel reference; do
            test ! -e "native/filesystems/cpm/$forbidden"
          done
          while IFS= read -r entry; do
            test "$entry" = "DESIGN.md" || {
              echo "Unexpected CP/M implementation entry before promotion: $entry" >&2
              exit 1
            }
          done < <(find native/filesystems/cpm -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # CramFS remains imported Linux reference evidence until a
          # host-neutral read-only engine and adapters are independently built.
          test -s native/filesystems/cramfs/DESIGN.md
          test -d native/filesystems/cramfs/reference/linux
          for forbidden in core linux windows userspace kernel; do
            test ! -e "native/filesystems/cramfs/$forbidden"
          done
          while IFS= read -r entry; do
            case "$entry" in
              DESIGN.md|reference) ;;
              *) echo "Unexpected CramFS root entry while still in reference/import state: $entry" >&2; exit 1 ;;
            esac
          done < <(find native/filesystems/cramfs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test -s native/filesystems/cramfs/reference/linux/inode.c
          test -s native/filesystems/cramfs/reference/linux/uncompress.c
          test -s native/filesystems/cramfs/reference/linux/README
          ! grep -Fq 'native/filesystems/cramfs/reference' CMakeLists.txt

          # CryFS is an external userspace provider. Until an explicit
          # first-party implementation exists, this directory is docs-only.
          test -s native/filesystems/cryfs/DESIGN.md
          for forbidden in .gitkeep core userspace linux windows kernel reference; do
            test ! -e "native/filesystems/cryfs/$forbidden"
          done
          while IFS= read -r entry; do
            test "$entry" = "DESIGN.md" || {
              echo "Unexpected CryFS implementation entry: $entry" >&2
              exit 1
            }
          done < <(find native/filesystems/cryfs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # CurlFtpFS is currently an external FTP userspace provider. Until
          # a first-party userspace implementation is admitted, DESIGN.md is
          # the complete filesystem directory.
          test -s native/filesystems/curlftpfs/DESIGN.md
          for forbidden in .gitkeep core userspace linux windows kernel reference; do
            test ! -e "native/filesystems/curlftpfs/$forbidden"
          done
          while IFS= read -r entry; do
            test "$entry" = "DESIGN.md" || {
              echo "Unexpected CurlFtpFS implementation entry: $entry" >&2
              exit 1
            }
          done < <(find native/filesystems/curlftpfs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # davfs2 is currently an external WebDAV userspace provider. Until
          # a first-party userspace implementation is admitted, DESIGN.md is
          # the complete filesystem directory.
          test -s native/filesystems/davfs2/DESIGN.md
          for forbidden in .gitkeep core userspace linux windows kernel reference; do
            test ! -e "native/filesystems/davfs2/$forbidden"
          done
          while IFS= read -r entry; do
            test "$entry" = "DESIGN.md" || {
              echo "Unexpected davfs2 implementation entry: $entry" >&2
              exit 1
            }
          done < <(find native/filesystems/davfs2 -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # disorderfs is currently an external userspace testing overlay.
          # Until a first-party userspace implementation is admitted, DESIGN.md
          # is the complete filesystem directory.
          test -s native/filesystems/disorderfs/DESIGN.md
          for forbidden in .gitkeep core userspace linux windows kernel reference; do
            test ! -e "native/filesystems/disorderfs/$forbidden"
          done
          while IFS= read -r entry; do
            test "$entry" = "DESIGN.md" || {
              echo "Unexpected disorderfs implementation entry: $entry" >&2
              exit 1
            }
          done < <(find native/filesystems/disorderfs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # eCryptfs remains imported reference evidence until its portable
          # filesystem semantics and thin adapters are independently written.
          test -s native/filesystems/ecryptfs/DESIGN.md
          test -d native/filesystems/ecryptfs/reference/linux
          for forbidden in core linux windows userspace kernel; do
            test ! -e "native/filesystems/ecryptfs/$forbidden"
          done
          while IFS= read -r entry; do
            case "$entry" in
              DESIGN.md|reference) ;;
              *) echo "Unexpected eCryptfs root entry while still in reference/import state: $entry" >&2; exit 1 ;;
            esac
          done < <(find native/filesystems/ecryptfs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test -s native/filesystems/ecryptfs/reference/linux/crypto.c
          test -s native/filesystems/ecryptfs/reference/linux/keystore.c
          test -s native/filesystems/ecryptfs/reference/linux/inode.c
          ! grep -Fq 'native/filesystems/ecryptfs/reference' CMakeLists.txt

          # SGI EFS remains read-only imported reference evidence until a
          # host-neutral read-only engine and thin adapters are independently built.
          test -s native/filesystems/efs/DESIGN.md
          test -d native/filesystems/efs/reference/linux
          for forbidden in core linux windows userspace kernel; do
            test ! -e "native/filesystems/efs/$forbidden"
          done
          while IFS= read -r entry; do
            case "$entry" in
              DESIGN.md|reference) ;;
              *) echo "Unexpected EFS root entry while still in reference/import state: $entry" >&2; exit 1 ;;
            esac
          done < <(find native/filesystems/efs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test -s native/filesystems/efs/reference/linux/efs.h
          test -s native/filesystems/efs/reference/linux/super.c
          test -s native/filesystems/efs/reference/linux/inode.c
          test -s native/filesystems/efs/reference/linux/dir.c
          ! grep -Fq 'native/filesystems/efs/reference' CMakeLists.txt

          # EncFS is currently an external encrypted-overlay provider. A
          # future core/userspace implementation requires explicit promotion;
          # until then DESIGN.md is the complete filesystem directory.
          test -s native/filesystems/encfs/DESIGN.md
          for forbidden in .gitkeep core userspace linux windows kernel reference; do
            test ! -e "native/filesystems/encfs/$forbidden"
          done
          while IFS= read -r entry; do
            test "$entry" = "DESIGN.md" || {
              echo "Unexpected EncFS implementation entry before promotion: $entry" >&2
              exit 1
            }
          done < <(find native/filesystems/encfs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # EROFS remains imported read-only reference evidence until its
          # canonical compressed-image engine is independently implemented.
          test -s native/filesystems/erofs/DESIGN.md
          test -d native/filesystems/erofs/reference/linux
          for forbidden in core linux windows userspace kernel; do
            test ! -e "native/filesystems/erofs/$forbidden"
          done
          while IFS= read -r entry; do
            case "$entry" in
              DESIGN.md|reference) ;;
              *) echo "Unexpected EROFS root entry while still in reference/import state: $entry" >&2; exit 1 ;;
            esac
          done < <(find native/filesystems/erofs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test -s native/filesystems/erofs/reference/linux/erofs_fs.h
          test -s native/filesystems/erofs/reference/linux/zmap.c
          test -s native/filesystems/erofs/reference/linux/decompressor.c
          ! grep -Fq 'native/filesystems/erofs/reference' CMakeLists.txt

          # erofsfuse is only an external userspace provider for the same
          # canonical EROFS filesystem. First-party userspace support belongs
          # under erofs/userspace, so this provider directory is docs-only.
          test -s native/filesystems/erofsfuse/DESIGN.md
          for forbidden in .gitkeep core userspace linux windows kernel reference; do
            test ! -e "native/filesystems/erofsfuse/$forbidden"
          done
          while IFS= read -r entry; do
            test "$entry" = "DESIGN.md" || {
              echo "Unexpected erofsfuse implementation entry: $entry" >&2
              exit 1
            }
          done < <(find native/filesystems/erofsfuse -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # exFAT remains imported Linux reference evidence until one
          # canonical cross-platform engine is independently rewritten.
          test -s native/filesystems/exfat/DESIGN.md
          test -d native/filesystems/exfat/reference/linux
          for forbidden in core linux windows userspace kernel; do
            test ! -e "native/filesystems/exfat/$forbidden"
          done
          while IFS= read -r entry; do
            case "$entry" in
              DESIGN.md|reference) ;;
              *) echo "Unexpected exFAT root entry while still in reference/import state: $entry" >&2; exit 1 ;;
            esac
          done < <(find native/filesystems/exfat -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test -s native/filesystems/exfat/reference/linux/exfat_raw.h
          test -s native/filesystems/exfat/reference/linux/super.c
          test -s native/filesystems/exfat/reference/linux/dir.c
          test -s native/filesystems/exfat/reference/linux/fatent.c
          ! grep -Fq 'native/filesystems/exfat/reference' CMakeLists.txt

          # exfat-fuse is an external userspace provider for the same exFAT
          # engine; first-party userspace support belongs under exfat/userspace.
          test -s native/filesystems/exfat-fuse/DESIGN.md
          for forbidden in .gitkeep core userspace linux windows kernel reference; do
            test ! -e "native/filesystems/exfat-fuse/$forbidden"
          done
          while IFS= read -r entry; do
            test "$entry" = "DESIGN.md" || {
              echo "Unexpected exfat-fuse implementation entry: $entry" >&2
              exit 1
            }
          done < <(find native/filesystems/exfat-fuse -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)

          # F2FS remains imported Linux reference evidence until its flash,
          # checkpoint and segment semantics are independently rewritten.
          test -s native/filesystems/f2fs/DESIGN.md
          test -d native/filesystems/f2fs/reference/linux
          for forbidden in core linux windows userspace kernel; do
            test ! -e "native/filesystems/f2fs/$forbidden"
          done
          while IFS= read -r entry; do
            case "$entry" in
              DESIGN.md|reference) ;;
              *) echo "Unexpected F2FS root entry while still in reference/import state: $entry" >&2; exit 1 ;;
            esac
          done < <(find native/filesystems/f2fs -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test -s native/filesystems/f2fs/reference/linux/f2fs.h
          test -s native/filesystems/f2fs/reference/linux/checkpoint.c
          test -s native/filesystems/f2fs/reference/linux/segment.c
          test -s native/filesystems/f2fs/reference/linux/recovery.c
          ! grep -Fq 'native/filesystems/f2fs/reference' CMakeLists.txt

          # FAT12/16/32 remains imported Linux reference evidence until the
          # canonical FAT family engine is independently implemented.
          test -s native/filesystems/fat/DESIGN.md
          test -d native/filesystems/fat/reference/linux
          for forbidden in core linux windows userspace kernel; do
            test ! -e "native/filesystems/fat/$forbidden"
          done
          while IFS= read -r entry; do
            case "$entry" in
              DESIGN.md|reference) ;;
              *) echo "Unexpected FAT root entry while still in reference/import state: $entry" >&2; exit 1 ;;
            esac
          done < <(find native/filesystems/fat -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test -s native/filesystems/fat/reference/linux/fat.h
          test -s native/filesystems/fat/reference/linux/fatent.c
          test -s native/filesystems/fat/reference/linux/namei_msdos.c
          test -s native/filesystems/fat/reference/linux/namei_vfat.c
          ! grep -Fq 'native/filesystems/fat/reference' CMakeLists.txt

          # FileVault/FVDE is an encrypted-volume layer; decrypted contents
          # are handed to the owning filesystem implementation.
          test ! -e native/filesystems/filevault/.gitkeep
          test ! -e native/filesystems/filevault/kernel
          test -s native/filesystems/filevault/DESIGN.md

          # Fosfat is the Smaky filesystem identity. The present provider is
          # userspace/read-only, but future semantics belong in one core.
          test ! -e native/filesystems/fosfat/.gitkeep
          test ! -e native/filesystems/fosfat/kernel
          test -s native/filesystems/fosfat/DESIGN.md

          # fscrypt is encryption tooling/policy consumed by owning
          # filesystems, not a standalone filesystem implementation.
          test ! -e native/filesystems/fscrypt/.gitkeep
          test ! -e native/filesystems/fscrypt/kernel
          test ! -e native/filesystems/fscrypt/core
          test -s native/filesystems/fscrypt/DESIGN.md

          # fuse-overlayfs is a userspace OverlayFS provider for container/
          # rootless overlay use; it is not another on-disk filesystem engine.
          test ! -e native/filesystems/fuse-overlayfs/.gitkeep
          test ! -e native/filesystems/fuse-overlayfs/kernel
          test ! -e native/filesystems/fuse-overlayfs/core
          test -s native/filesystems/fuse-overlayfs/DESIGN.md

          # fuse2fs is an external userspace provider spanning EXT2/3/4.
          # It must not become a fourth shared/duplicate EXT implementation.
          test ! -e native/filesystems/fuse2fs/.gitkeep
          test ! -e native/filesystems/fuse2fs/kernel
          test ! -e native/filesystems/fuse2fs/core
          test -s native/filesystems/fuse2fs/DESIGN.md

          # fusefat is an external userspace provider spanning FAT and exFAT.
          # It must not create another FAT-family or exFAT engine.
          test ! -e native/filesystems/fusefat/.gitkeep
          test ! -e native/filesystems/fusefat/kernel
          test ! -e native/filesystems/fusefat/core
          test -s native/filesystems/fusefat/DESIGN.md

          # fuseiso is an external userspace image/ISO provider, not a
          # second ISO9660 implementation.
          test ! -e native/filesystems/fuseiso/.gitkeep
          test ! -e native/filesystems/fuseiso/kernel
          test ! -e native/filesystems/fuseiso/core
          test -s native/filesystems/fuseiso/DESIGN.md

          # fusezip is a userspace ZIP archive provider, not a block filesystem.
          test ! -e native/filesystems/fusezip/.gitkeep
          test ! -e native/filesystems/fusezip/kernel
          test ! -e native/filesystems/fusezip/core
          test -s native/filesystems/fusezip/DESIGN.md

          # GFS2 remains upstream Linux reference evidence until a canonical
          # clustered-filesystem core and thin host/cluster adapters are rewritten.
          test ! -e native/filesystems/gfs2/kernel
          test -s native/filesystems/gfs2/reference/linux/glock.c
          test -s native/filesystems/gfs2/reference/linux/rgrp.c
          test -s native/filesystems/gfs2/DESIGN.md

          # GlusterFS is a high-level distributed userspace client/provider.
          test ! -e native/filesystems/glusterfs/.gitkeep
          test ! -e native/filesystems/glusterfs/kernel
          test -s native/filesystems/glusterfs/DESIGN.md

          # go-mtpfs is a userspace MTP device provider.
          test ! -e native/filesystems/go-mtpfs/.gitkeep
          test ! -e native/filesystems/go-mtpfs/kernel
          test ! -e native/filesystems/go-mtpfs/core
          test -s native/filesystems/go-mtpfs/DESIGN.md

          # gocryptfs is an encrypted userspace overlay provider.
          test ! -e native/filesystems/gocryptfs/.gitkeep
          test ! -e native/filesystems/gocryptfs/kernel
          test -s native/filesystems/gocryptfs/DESIGN.md

          # GPhotoFS is a userspace camera/PTP device provider.
          test ! -e native/filesystems/gphotofs/.gitkeep
          test ! -e native/filesystems/gphotofs/kernel
          test ! -e native/filesystems/gphotofs/core
          test -s native/filesystems/gphotofs/DESIGN.md

          # guestmount/libguestfs is a userspace virtual-disk/container access
          # layer; contained filesystem semantics stay with their own engines.
          test ! -e native/filesystems/guestmount/.gitkeep
          test ! -e native/filesystems/guestmount/kernel
          test ! -e native/filesystems/guestmount/core
          test -s native/filesystems/guestmount/DESIGN.md

          # GVfs-FUSE is a desktop userspace bridge over GVfs/GIO mounts.
          test ! -e native/filesystems/gvfs-fuse/.gitkeep
          test ! -e native/filesystems/gvfs-fuse/kernel
          test ! -e native/filesystems/gvfs-fuse/core
          test -s native/filesystems/gvfs-fuse/DESIGN.md

          # Classic HFS remains imported Linux reference evidence until its
          # canonical local-filesystem engine is independently rewritten.
          test ! -e native/filesystems/hfs/kernel
          test -s native/filesystems/hfs/reference/linux/btree.c
          test -s native/filesystems/hfs/reference/linux/catalog.c
          test -s native/filesystems/hfs/DESIGN.md

          # Active rewrite trees use Filesystem Support responsibility
          # boundaries, not the imported Linux/AFFS/ASFS file layout.
          for legacy in \
            native/filesystems/ext2/linux/balloc.c \
            native/filesystems/ext2/linux/dir.c \
            native/filesystems/ext2/linux/file.c \
            native/filesystems/ext2/linux/inode.c \
            native/filesystems/ext2/linux/namei.c \
            native/filesystems/ext2/linux/super.c \
            native/filesystems/ext3/linux/balloc.c \
            native/filesystems/ext3/linux/jbd_journal.c \
            native/filesystems/ext3/linux/jbd_transaction.c \
            native/filesystems/ext4/linux/balloc.c \
            native/filesystems/ext4/linux/jbd2_journal.c \
            native/filesystems/ext4/linux/jbd2_transaction.c \
            native/filesystems/ofs/linux/affs.h \
            native/filesystems/ffs/linux/affs.h \
            native/filesystems/sfs/linux/asfs_fs.h \
            native/filesystems/sfs/linux/Changes; do
            test ! -e "$legacy"
          done

          refresh=.github/workflows/import-linux-filesystems.yml
          if test -f "$refresh"; then
            ! grep -Eq 'fs/ext2([ /]|$)|fs/ext3([ /]|$)|fs/ext4([ /]|$)|fs/affs([ /]|$)|linux-ext3|shape-ext[234]|harden-ext-ranges|recomment-ext-family' "$refresh"
            ! grep -Eq 'native/filesystems/(ext2|ext3|ext4|ofs|ffs|sfs|sfs2|pfs3)' "$refresh"
            grep -Fq 'copy_tree fs/9p native/filesystems/9p/reference/linux' "$refresh"
            ! grep -Fq 'copy_tree fs/9p native/filesystems/9p/kernel' "$refresh"
            grep -Fq 'copy_tree fs/adfs native/filesystems/adfs/reference/linux' "$refresh"
            ! grep -Fq 'copy_tree fs/adfs native/filesystems/adfs/kernel' "$refresh"
            grep -Fq 'copy_tree fs/bcachefs native/filesystems/bcachefs/reference/linux' "$refresh"
            ! grep -Fq 'copy_tree fs/bcachefs native/filesystems/bcachefs/kernel' "$refresh"
            grep -Fq 'copy_tree fs/befs native/filesystems/befs/reference/linux' "$refresh"
            ! grep -Fq 'copy_tree fs/befs native/filesystems/befs/kernel' "$refresh"
            grep -Fq 'copy_tree fs/btrfs native/filesystems/btrfs/reference/linux' "$refresh"
            ! grep -Fq 'copy_tree fs/btrfs native/filesystems/btrfs/kernel' "$refresh"
            grep -Fq 'copy_tree fs/cramfs native/filesystems/cramfs/reference/linux' "$refresh"
            ! grep -Fq 'copy_tree fs/cramfs native/filesystems/cramfs/kernel' "$refresh"
            grep -Fq 'copy_tree fs/ecryptfs native/filesystems/ecryptfs/reference/linux' "$refresh"
            ! grep -Fq 'copy_tree fs/ecryptfs native/filesystems/ecryptfs/kernel' "$refresh"
            grep -Fq 'copy_tree fs/erofs native/filesystems/erofs/reference/linux' "$refresh"
            ! grep -Fq 'copy_tree fs/erofs native/filesystems/erofs/kernel' "$refresh"
            grep -Fq 'copy_tree fs/exfat native/filesystems/exfat/reference/linux' "$refresh"
            ! grep -Fq 'copy_tree fs/exfat native/filesystems/exfat/kernel' "$refresh"
            grep -Fq 'copy_tree fs/f2fs native/filesystems/f2fs/reference/linux' "$refresh"
            ! grep -Fq 'copy_tree fs/f2fs native/filesystems/f2fs/kernel' "$refresh"
            grep -Fq 'copy_tree fs/fat native/filesystems/fat/reference/linux' "$refresh"
            ! grep -Fq 'copy_tree fs/fat native/filesystems/fat/kernel' "$refresh"
            grep -Fq 'copy_tree fs/efs native/filesystems/efs/reference/linux' "$refresh"
            ! grep -Fq 'copy_tree fs/efs native/filesystems/efs/kernel' "$refresh"
            grep -Fq 'copy_tree fs/ceph native/filesystems/cephfs/reference/linux' "$refresh"
            ! grep -Fq 'copy_tree fs/ceph native/filesystems/cephfs/kernel' "$refresh"
            grep -Fq 'native/filesystems/cifs/reference/linux/client' "$refresh"
            grep -Fq 'native/filesystems/cifs/reference/linux/common' "$refresh"
            ! grep -Fq 'native/filesystems/cifs/kernel' "$refresh"
            grep -Fq 'copy_tree fs/bfs native/filesystems/bfs/reference/linux' "$refresh"
            ! grep -Fq 'copy_tree fs/bfs native/filesystems/bfs/kernel' "$refresh"
            grep -Fq 'copy_tree fs/gfs2 native/filesystems/gfs2/reference/linux' "$refresh"
            ! grep -Fq 'copy_tree fs/gfs2 native/filesystems/gfs2/kernel' "$refresh"
            grep -Fq 'copy_tree fs/hfs native/filesystems/hfs/reference/linux' "$refresh"
            ! grep -Fq 'copy_tree fs/hfs native/filesystems/hfs/kernel' "$refresh"
          fi

