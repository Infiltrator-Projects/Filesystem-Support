name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Main pushes are serialized by branch. This closes the race in which two
# untagged commits carrying the same VERSION could both begin promotion before
# the first run establishes the immutable v<version> tag. PRs remain isolated
# by PR number and may cancel stale work.
concurrency:
  group: filesystem-support-build-v6-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact main-package source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build and migration-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libgtk-3-dev dpkg-dev python3 \
            policykit-1 udev libudisks2-0 gnome-disk-utility xvfb xauth

      - name: Build and test the single main package
        run: |
          cmake -S . -B build-desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build-desktop
          ctest --test-dir build-desktop --output-on-failure
          cpack --config build-desktop/CPackConfig.cmake -G DEB -B dist-desktop

      - name: Verify actual APT install, retirement migration and purge
        run: bash tests/desktop_package_test.sh dist-desktop/*.deb

      - name: Build and verify the complete release bundle
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          deb="dist-desktop/Filesystem-Support-$version-amd64.deb"
          run="dist-desktop/Filesystem-Support-$version-amd64.run"
          test -f "$deb"
          ./packaging/build-run.sh "$deb" "$run"
          test -x "$run"

          help=$("$run" --help)
          grep -Fq '/usr/bin/fsinspect' <<<"$help"
          grep -Fq 'per-filesystem desktop templates' <<<"$help"
          grep -Fq 'project-native Amiga filesystems' <<<"$help"

          # Qualification is about the bytes that will be promoted. Prove that
          # the wrapper contains exactly the Debian package already exercised by
          # the package/install tests, not a later rebuild or second package.
          python3 - "$deb" "$run" <<'PY'
          from pathlib import Path
          import io
          import sys
          import tarfile

          deb = Path(sys.argv[1]).read_bytes()
          wrapper = Path(sys.argv[2]).read_bytes()
          marker = b"\n__ARCHIVE_BELOW__\n"
          start = wrapper.find(marker)
          if start < 0:
              raise SystemExit("run installer archive marker is missing")
          payload = wrapper[start + len(marker):]
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              names = archive.getnames()
              if names != ["filesystem-support.deb"]:
                  raise SystemExit(f"unexpected run payload: {names}")
              embedded = archive.extractfile("filesystem-support.deb")
              if embedded is None or embedded.read() != deb:
                  raise SystemExit("run installer does not embed the qualified Debian package")
          PY

          (
            cd dist-desktop
            sha256sum \
              "Filesystem-Support-$version-amd64.deb" \
              "Filesystem-Support-$version-amd64.run" \
              > RELEASE_SHA256SUMS.txt
            sha256sum -c RELEASE_SHA256SUMS.txt
          )

      - name: Preserve the exact qualified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: filesystem-support-linux-release
          path: |
            dist-desktop/Filesystem-Support-*-amd64.deb
            dist-desktop/Filesystem-Support-*-amd64.run
            dist-desktop/RELEASE_SHA256SUMS.txt
          if-no-files-found: error

  source-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce immutable source version identity
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "VERSION must contain major.minor.patch." >&2
            exit 1
          }

          tag_refs=$(git ls-remote --tags origin \
            "refs/tags/v${version}" "refs/tags/v${version}^{}")
          if [[ -n "$tag_refs" ]]; then
            tag_commit=$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<<"$tag_refs" | tail -n1)
            if [[ -z "$tag_commit" ]]; then
              tag_commit=$(awk 'NR == 1 { print $1 }' <<<"$tag_refs")
            fi
            head_commit=$(git rev-parse HEAD)
            if [[ "$tag_commit" != "$head_commit" ]] &&
               ! git diff --quiet "$tag_commit" HEAD -- . ':!.github/workflows'; then
              printf 'Source version %s is already tagged at %s; current main is %s. Advance VERSION before further development.\n' \
                "$version" "$tag_commit" "$head_commit" >&2
              exit 1
            fi
          fi

      - name: Validate source and repository architecture boundaries
        run: |
          bash tools/validate-source-contract.sh
          python3 tests/repository_architecture_test.py .

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev libudisks2-0

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify native Linux install payload from manifest
        shell: bash
        run: |
          set -euo pipefail
          bash -n packaging/linux/native-module-helper.sh
          rm -rf /tmp/filesystem-support-stage
          DESTDIR=/tmp/filesystem-support-stage cmake --install build --prefix /usr
          helper=/tmp/filesystem-support-stage/usr/lib/infiltrator-filesystem-support/native-module-helper
          test -x "$helper"

          while IFS=$'\t' read -r fs module; do
            [[ -n "$fs" && "${fs:0:1}" != "#" ]] || continue
            base="/tmp/filesystem-support-stage/usr/lib/infiltrator-filesystem-support/native/filesystems/$fs"
            test -f "$base/linux/Makefile"
            test -d "$base/core"
          done < data/native-filesystems.tsv

          test ! -e /tmp/filesystem-support-stage/usr/lib/infiltrator-filesystem-support/native/filesystems/affs

  linux-native-modules-6-12:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Linux 6.12.107 build API once
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev
          git clone --depth 1 --branch v6.12.107 https://github.com/gregkh/linux.git /tmp/linux-6.12.107
          make -C /tmp/linux-6.12.107 defconfig
          /tmp/linux-6.12.107/scripts/config --file /tmp/linux-6.12.107/.config \
            --enable EXT2_FS \
            --enable EXT2_FS_XATTR \
            --enable EXT2_FS_POSIX_ACL \
            --enable EXT2_FS_SECURITY \
            --enable EXT4_FS \
            --enable EXT4_FS_POSIX_ACL \
            --enable EXT4_FS_SECURITY \
            --enable FS_DAX \
            --enable FS_ENCRYPTION \
            --enable FS_VERITY \
            --enable QUOTA
          make -C /tmp/linux-6.12.107 olddefconfig
          make -C /tmp/linux-6.12.107 modules_prepare

      - name: Build every managed native module from the deployment manifest
        shell: bash
        run: |
          set -euo pipefail

          while IFS=$'\t' read -r fs module; do
            [[ -n "$fs" && "${fs:0:1}" != "#" ]] || continue
            log="/tmp/${fs}-6.12-build.log"
            make -C /tmp/linux-6.12.107 \
              M="$PWD/native/filesystems/$fs/linux" \
              KBUILD_MODPOST_WARN=1 modules 2>&1 | tee "$log"
            test -s "native/filesystems/$fs/linux/$module.ko"
            ! grep -Fq 'section mismatch' "$log"

            case "$fs" in
              ext2) grep -Fq 'metadata.o' "$log" ;;
              ext4) grep -Fq 'security_support.o' "$log" ;;
            esac
          done < data/native-filesystems.tsv

  linux-amiga-v7-module-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Linux 7.0 build API
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev
          git clone --depth 1 --branch v7.0 https://github.com/torvalds/linux.git /tmp/linux-7.0
          make -C /tmp/linux-7.0 defconfig
          make -C /tmp/linux-7.0 modules_prepare

      - name: Build every desktop-integrated Amiga native module
        shell: bash
        run: |
          set -euo pipefail

          while IFS=$'\t' read -r fs desktop_variant; do
            [[ -n "$fs" && "${fs:0:1}" != "#" ]] || continue
            module=$(awk -F '\t' -v fs="$fs" '
              $0 !~ /^#/ && $1 == fs { print $2; found = 1; exit }
              END { if (!found) exit 1 }
            ' data/native-filesystems.tsv)
            [[ -n "$module" ]]
            log="/tmp/${fs}-v7-build.log"
            make -C /tmp/linux-7.0 \
              M="$PWD/native/filesystems/$fs/linux" \
              KBUILD_MODPOST_WARN=1 modules 2>&1 | tee "$log"
            test -s "native/filesystems/$fs/linux/$module.ko"
            ! grep -Fq 'section mismatch' "$log"
          done < data/desktop-filesystems.tsv

  windows-manager:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: powershell
        run: cmake -S . -B build-windows -A x64 -DBUILD_TESTING=OFF

      - name: Build
        shell: powershell
        run: cmake --build build-windows --config Release

      - name: Verify manager
        shell: powershell
        run: |
          $manager = Get-ChildItem -LiteralPath build-windows -Filter filesystem-support.exe -File -Recurse |
              Select-Object -First 1
          if (-not $manager) {
            throw 'Windows Filesystem Support manager was not produced.'
          }
          Write-Host "Manager: $($manager.FullName)"

  windows-ext2-driver:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build, analyze and validate canonical EXT2 driver
        shell: powershell
        run: .\windows\build\Build-Ext2Driver.ps1 -Configuration Release -Platform x64

      - name: Verify staged driver package
        shell: powershell
        run: |
          $driver = 'release\windows\ext2\x64\filesystem_support_ext2.sys'
          $inf = 'release\windows\ext2\x64\filesystem_support_ext2.inf'
          $cat = 'release\windows\ext2\x64\filesystem_support_ext2.cat'
          foreach ($path in @($driver, $inf, $cat)) {
              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Expected staged EXT2 driver artifact missing: $path"
              }
          }
          Get-FileHash -Algorithm SHA256 -LiteralPath $driver, $cat | Format-Table

  # VERSION + its immutable tag are the release-state authority. An untagged
  # source version on main is eligible for promotion; an existing tag at another
  # SHA means this is ordinary post-release workflow-only maintenance.
  release-state:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      promote: ${{ steps.state.outputs.promote }}
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve immutable version/tag state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          tag_refs=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if [[ -z "$tag_refs" ]]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
            echo "$tag does not exist; this exact source version enters release qualification."
            exit 0
          fi

          tag_commit=$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<<"$tag_refs" | tail -n1)
          if [[ -z "$tag_commit" ]]; then
            tag_commit=$(awk 'NR == 1 { print $1 }' <<<"$tag_refs")
          fi
          if [[ "$tag_commit" == "$GITHUB_SHA" ]]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
            echo "$tag already identifies this exact SHA; idempotent release verification is allowed."
          else
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "$tag already identifies $tag_commit; this SHA is not a release candidate."
          fi

  release-sanitizers:
    needs: release-state
    if: needs.release-state.outputs.promote == 'true'
    uses: ./.github/workflows/sanitizers.yml
    with:
      sha: ${{ github.sha }}

  release-ext-runtime:
    needs: release-state
    if: needs.release-state.outputs.promote == 'true'
    uses: ./.github/workflows/ext-runtime-qualification.yml
    with:
      sha: ${{ github.sha }}

  release-amiga-runtime:
    needs: release-state
    if: needs.release-state.outputs.promote == 'true'
    uses: ./.github/workflows/amiga-runtime-qualification.yml
    with:
      sha: ${{ github.sha }}

  publish-release:
    needs:
      - desktop-integration
      - source-boundary
      - linux
      - linux-native-modules-6-12
      - linux-amiga-v7-module-api
      - windows-manager
      - windows-ext2-driver
      - release-state
      - release-sanitizers
      - release-ext-runtime
      - release-amiga-runtime
    if: needs.release-state.outputs.promote == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact qualified release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Retrieve the exact qualified release bundle
        uses: actions/download-artifact@v4
        with:
          name: filesystem-support-linux-release
          path: dist

      - name: Verify qualified release artefacts without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          deb="Filesystem-Support-$version-amd64.deb"
          run="Filesystem-Support-$version-amd64.run"
          test -f "dist/$deb"
          test -f "dist/$run"
          test -f dist/RELEASE_SHA256SUMS.txt
          (
            cd dist
            sha256sum -c RELEASE_SHA256SUMS.txt
          )
          test "$(dpkg-deb -f "dist/$deb" Package)" = infiltrator-filesystem-support
          test "$(dpkg-deb -f "dist/$deb" Version)" = "$version"
          python3 tests/udisks_display_test.py --package "dist/$deb"
          test "$(dpkg-deb -f "dist/$deb" Conflicts)" = infiltrator-filesystem-support-udisks
          ! dpkg-deb -f "dist/$deb" Depends | grep -Fq infiltrator-filesystem-support-udisks
          dpkg-deb -c "dist/$deb" > package-contents.txt
          grep -Fq './usr/bin/fsinspect' package-contents.txt
          grep -Fq '/desktop/templates/ofs.so' package-contents.txt
          grep -Fq '/usr/lib/infiltrator-filesystem-support/native-filesystems.tsv' package-contents.txt
          ! grep -Fq '59-infiltrator-filesystems.rules' package-contents.txt
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.run' | wc -l)" = 1

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          tag="v$version"
          deb="Filesystem-Support-$version-amd64.deb"
          run="Filesystem-Support-$version-amd64.run"

          git fetch origin --tags
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_commit=$(git rev-list -n 1 "$tag")
            test "$tag_commit" = "$GITHUB_SHA" || {
              echo "Tag $tag does not point at the qualified release commit." >&2
              exit 1
            }
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            target=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.target_commitish')
            test "$target" = "$GITHUB_SHA" || {
              echo "Release $tag targets $target instead of $GITHUB_SHA." >&2
              exit 1
            }

            expected=$(printf '%s\n%s\n%s\n' "$deb" "$run" RELEASE_SHA256SUMS.txt | sort)
            actual=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
            test "$actual" = "$expected" || {
              echo "Release $tag exists with a different asset set." >&2
              exit 1
            }

            published=$(mktemp -d)
            trap 'rm -rf "$published"' EXIT
            gh release download "$tag" --dir "$published" \
              --pattern "$deb" \
              --pattern "$run" \
              --pattern RELEASE_SHA256SUMS.txt
            cmp "dist/$deb" "$published/$deb"
            cmp "dist/$run" "$published/$run"
            cmp dist/RELEASE_SHA256SUMS.txt "$published/RELEASE_SHA256SUMS.txt"
            echo "Release $tag already exists and exactly matches this workflow's qualified artifacts."
            exit 0
          fi

          cat > release-notes.md <<EOF
          Filesystem Support $version.

          This release promotes the exact Debian package, self-extracting installer and checksum manifest built and tested from commit $GITHUB_SHA. EXT, Amiga and sanitizer/adversarial qualification all ran against that same immutable SHA before publication.

          Release assets:
          - Generic AMD64 Debian package
          - Native self-extracting .run installer
          - SHA-256 checksum manifest

          GitHub also provides source ZIP and TAR.GZ archives for this tag.
          EOF

          gh release create "$tag" \
            "dist/$deb" \
            "dist/$run" \
            dist/RELEASE_SHA256SUMS.txt \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "Filesystem Support $version" \
            --notes-file release-notes.md \
            --latest

          expected=$(printf '%s\n%s\n%s\n' "$deb" "$run" RELEASE_SHA256SUMS.txt | sort)
          actual=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          test "$actual" = "$expected"

      - name: Withdraw retired desktop packages and their dependent installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/retire-desktop-package.py
