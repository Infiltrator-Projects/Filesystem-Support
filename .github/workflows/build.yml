name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: filesystem-support-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce immutable source version identity
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "VERSION must contain major.minor.patch." >&2
            exit 1
          }

          tag_refs=$(git ls-remote --tags origin \
            "refs/tags/v${version}" "refs/tags/v${version}^{}")
          if [[ -n "$tag_refs" ]]; then
            tag_commit=$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<<"$tag_refs" | tail -n1)
            if [[ -z "$tag_commit" ]]; then
              tag_commit=$(awk 'NR == 1 { print $1 }' <<<"$tag_refs")
            fi
            head_commit=$(git rev-parse HEAD)
            if [[ "$tag_commit" != "$head_commit" ]]; then
              printf 'Source version %s is already tagged at %s; current main is %s. Advance VERSION before further development.\n' \
                "$version" "$tag_commit" "$head_commit" >&2
              exit 1
            fi
          fi

      - name: Enforce rewrite boundaries
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/shape-ext2.sh
          test ! -e tools/shape-ext3.sh
          test ! -e tools/shape-ext4.sh
          test ! -e tools/harden-ext-ranges.py

          refresh=.github/workflows/import-linux-filesystems.yml
          if test -f "$refresh"; then
            ! grep -Eq 'fs/ext2([ /]|$)|fs/ext3([ /]|$)|fs/ext4([ /]|$)|fs/affs([ /]|$)|linux-ext3|shape-ext[234]|harden-ext-ranges|recomment-ext-family' "$refresh"
            ! grep -Eq 'native/filesystems/(ext2|ext3|ext4|ofs|ffs|sfs|sfs2|pfs3)' "$refresh"
          fi

      - name: Verify rewritten EXT2 file layer provenance
        shell: bash
        run: |
          set -euo pipefail
          test -s native/filesystems/ext2/linux/xattr.c
          ! grep -Eiq 'SPDX-License-Identifier|Remy Card|Linus Torvalds|Stephen Tweedie|David S\. Miller|Al Viro|Jakub Jelinek' native/filesystems/ext2/linux/xattr.c
          test -s native/filesystems/ext2/linux/super.c
          ! grep -Eiq 'SPDX-License-Identifier|Remy Card|Linus Torvalds|Stephen Tweedie|David S\. Miller|Al Viro|Jakub Jelinek' native/filesystems/ext2/linux/super.c
          test -s native/filesystems/ext2/linux/inode.c
          ! grep -Eiq 'SPDX-License-Identifier|Remy Card|Linus Torvalds|Stephen Tweedie|Al Viro|Jakub Jelinek' native/filesystems/ext2/linux/inode.c
          file=native/filesystems/ext2/linux/file.c
          grep -Fq 'Copyright (C) 2026 Shannon Smith' "$file"
          ! grep -Eiq 'linux/fs/ext2|Remy Card|Linus Torvalds|Stephen Tweedie|Red Hat' "$file"
          for file in \
            native/filesystems/ext2/linux/namei.c \
            native/filesystems/ext2/linux/ialloc.c \
            native/filesystems/ext2/linux/balloc.c \
            native/filesystems/ext2/linux/dir.c \
            native/filesystems/ext2/linux/ext2.h; do
            test -s "$file"
            ! grep -Eiq 'linux/fs/(ext2|minix)|Remy Card|Linus Torvalds|Stephen Tweedie|David S\. Miller|Al Viro' "$file"
          done

      - name: Verify rewritten Amiga adapter provenance
        shell: bash
        run: |
          set -euo pipefail
          test ! -e native/filesystems/amiga_common
          test ! -e native/primitives/amiga_dos
          rewritten=(
            native/filesystems/ofs/linux/amigaffs.c
            native/filesystems/ofs/linux/bitmap.c
            native/filesystems/ofs/linux/dir.c
            native/filesystems/ofs/linux/inode.c
            native/filesystems/ofs/linux/namei.c
            native/filesystems/ofs/linux/super.c
            native/filesystems/ofs/linux/symlink.c
            native/filesystems/ofs/core/ofs_primitives.c
            native/filesystems/ffs/linux/amigaffs.c
            native/filesystems/ffs/linux/bitmap.c
            native/filesystems/ffs/linux/dir.c
            native/filesystems/ffs/linux/inode.c
            native/filesystems/ffs/linux/namei.c
            native/filesystems/ffs/linux/super.c
            native/filesystems/ffs/linux/symlink.c
            native/filesystems/ffs/core/ffs_primitives.c
          )
          for file in "${rewritten[@]}"; do
            test -s "$file"
            ! grep -Eiq 'linux/fs/affs|Hans-Joachim Widmaier|Ray Burr|Eric Youngdale|Linus Torvalds' "$file"
          done

      - name: Reject external Amiga provenance in active sources
        shell: bash
        run: |
          set -euo pipefail
          active=(native/filesystems/ofs native/filesystems/ffs native/filesystems/sfs)
          ! grep -R -Eiq             'Copyright \(C\).*(Marek|John Hendrikx|Ray Burr|Hans-Joachim|Linus|Janos|Volker|Paal|Gertjan)|linux/fs/affs|twojstaryzdomu/asfs|pfs3aio|Aaru.Filesystems|AmiPart'             "${active[@]}"
          test ! -e native/filesystems/sfs/reference
          test ! -e native/filesystems/sfs2/reference
          test ! -e native/filesystems/pfs3/reference

      - name: Enforce single EXT2 engine on Windows
        shell: bash
        run: |
          set -euo pipefail
          test ! -e native/filesystems/ext2/windows/ext2_compat.h
          ! grep -R -E 'archive/extfs-for-windows|core/extfs(_classic_resize|_resize_dispatch)?\.c'               native/filesystems/ext2/windows windows/build CMakeLists.txt
          grep -Fq '..\core\ext2_core.c'               native/filesystems/ext2/windows/filesystem_support_ext2.vcxproj
          grep -Fq '..\core\ext2_engine.c'               native/filesystems/ext2/windows/filesystem_support_ext2.vcxproj
          grep -Fq '#include "../core/ext2_engine.h"'               native/filesystems/ext2/windows/ext2_driver.h
          grep -Fq '#include "../core/ext2_engine.c"'               native/filesystems/ext2/linux/canonical.c
          grep -Fq 'xattr.o' native/filesystems/ext2/linux/Makefile
          grep -Fq -- '-DCONFIG_EXT2_FS_XATTR=1' native/filesystems/ext2/linux/Makefile
          grep -Fq -- '-DCONFIG_EXT2_FS_POSIX_ACL=1' native/filesystems/ext2/linux/Makefile
          grep -Fq -- '-DCONFIG_EXT2_FS_SECURITY=1' native/filesystems/ext2/linux/Makefile

  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify native Linux install payload
        shell: bash
        run: |
          set -euo pipefail
          bash -n packaging/linux/native-module-helper.sh
          rm -rf /tmp/filesystem-support-stage
          DESTDIR=/tmp/filesystem-support-stage cmake --install build --prefix /usr
          helper=/tmp/filesystem-support-stage/usr/lib/infiltrator-filesystem-support/native-module-helper
          test -x "$helper"
          for fs in ext2 ext3 ext4 ofs ffs sfs; do
            base="/tmp/filesystem-support-stage/usr/lib/infiltrator-filesystem-support/native/filesystems/$fs"
            test -f "$base/linux/Makefile"
            test -d "$base/core"
          done
          test ! -e /tmp/filesystem-support-stage/usr/lib/infiltrator-filesystem-support/native/filesystems/affs

  linux-ext2-module:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Linux 6.12.107 build API
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev
          git clone --depth 1 --branch v6.12.107 https://github.com/gregkh/linux.git /tmp/linux-6.12.107
          make -C /tmp/linux-6.12.107 defconfig
          /tmp/linux-6.12.107/scripts/config --file /tmp/linux-6.12.107/.config \
            --enable EXT2_FS \
            --enable EXT2_FS_XATTR \
            --enable EXT2_FS_POSIX_ACL \
            --enable EXT2_FS_SECURITY \
            --enable FS_DAX
          make -C /tmp/linux-6.12.107 olddefconfig
          make -C /tmp/linux-6.12.107 modules_prepare

      - name: Build EXT2 kernel module
        shell: bash
        run: |
          set -euo pipefail
          # modules_prepare deliberately does not create Module.symvers.  This
          # job qualifies source/API compatibility against the pinned kernel;
          # load-time symbol qualification is performed against a built or
          # installed target kernel that supplies its real Module.symvers.
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/ext2/linux" \
            KBUILD_MODPOST_WARN=1 modules 2>&1 | tee /tmp/ext2-build.log
          test -s native/filesystems/ext2/linux/ext2.ko
          ! grep -Fq 'section mismatch' /tmp/ext2-build.log
          grep -Fq 'xattr.o' /tmp/ext2-build.log

  linux-ext3-module:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Linux 6.12.107 build API
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev
          git clone --depth 1 --branch v6.12.107 https://github.com/gregkh/linux.git /tmp/linux-6.12.107
          make -C /tmp/linux-6.12.107 defconfig
          make -C /tmp/linux-6.12.107 modules_prepare

      - name: Build EXT3 kernel module
        shell: bash
        run: |
          set -euo pipefail
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/ext3/linux" \
            KBUILD_MODPOST_WARN=1 modules 2>&1 | tee /tmp/ext3-build.log
          test -s native/filesystems/ext3/linux/ext3.ko
          ! grep -Fq 'section mismatch' /tmp/ext3-build.log

  linux-ext4-module:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Linux 6.12.107 build API
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev
          git clone --depth 1 --branch v6.12.107 https://github.com/gregkh/linux.git /tmp/linux-6.12.107
          make -C /tmp/linux-6.12.107 defconfig
          /tmp/linux-6.12.107/scripts/config --file /tmp/linux-6.12.107/.config \
            --enable EXT4_FS \
            --enable EXT4_FS_POSIX_ACL \
            --enable EXT4_FS_SECURITY \
            --enable FS_ENCRYPTION \
            --enable FS_VERITY \
            --enable QUOTA
          make -C /tmp/linux-6.12.107 olddefconfig
          make -C /tmp/linux-6.12.107 modules_prepare

      - name: Build EXT4 kernel module
        shell: bash
        run: |
          set -euo pipefail
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/ext4/linux" \
            KBUILD_MODPOST_WARN=1 modules 2>&1 | tee /tmp/ext4-build.log
          test -s native/filesystems/ext4/linux/ext4.ko
          ! grep -Fq 'section mismatch' /tmp/ext4-build.log
          grep -Fq 'crypto.o' /tmp/ext4-build.log
          grep -Fq 'verity.o' /tmp/ext4-build.log

  linux-amiga-ofs-ffs-modules:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Linux 6.12.107 build API
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev
          git clone --depth 1 --branch v6.12.107 https://github.com/gregkh/linux.git /tmp/linux-6.12.107
          make -C /tmp/linux-6.12.107 defconfig
          make -C /tmp/linux-6.12.107 modules_prepare

      - name: Build independent OFS module
        shell: bash
        run: |
          set -euo pipefail
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/ofs/linux" \
            KBUILD_MODPOST_WARN=1 modules
          test -s native/filesystems/ofs/linux/ofs.ko

      - name: Build independent FFS module
        shell: bash
        run: |
          set -euo pipefail
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/ffs/linux" \
            KBUILD_MODPOST_WARN=1 modules
          test -s native/filesystems/ffs/linux/ffs.ko



  linux-sfs-module:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Linux 6.12.107 build API
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev
          git clone --depth 1 --branch v6.12.107 https://github.com/gregkh/linux.git /tmp/linux-6.12.107
          make -C /tmp/linux-6.12.107 defconfig
          make -C /tmp/linux-6.12.107 modules_prepare

      - name: Build native SFS kernel module
        shell: bash
        run: |
          set -euo pipefail
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/sfs/linux" \
            KBUILD_MODPOST_WARN=1 modules 2>&1 | tee /tmp/sfs-build.log
          test -s native/filesystems/sfs/linux/sfs.ko
          ! grep -Fq 'section mismatch' /tmp/sfs-build.log

  windows-manager:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: powershell
        run: cmake -S . -B build-windows -A x64 -DBUILD_TESTING=OFF

      - name: Build
        shell: powershell
        run: cmake --build build-windows --config Release

      - name: Verify manager
        shell: powershell
        run: |
          $manager = Get-ChildItem -LiteralPath build-windows -Filter filesystem-support.exe -File -Recurse |
              Select-Object -First 1
          if (-not $manager) {
              throw 'Windows Filesystem Support manager was not produced.'
          }
          Write-Host "Manager: $($manager.FullName)"

  windows-ext2-driver:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and validate canonical EXT2 driver
        shell: powershell
        run: .\windows\build\Build-Ext2Driver.ps1 -Configuration Release -Platform x64 -SkipCodeAnalysis

      - name: Verify staged driver package
        shell: powershell
        run: |
          $driver = 'release\windows\ext2\x64\filesystem_support_ext2.sys'
          $inf = 'release\windows\ext2\x64\filesystem_support_ext2.inf'
          $cat = 'release\windows\ext2\x64\filesystem_support_ext2.cat'
          foreach ($path in @($driver, $inf, $cat)) {
              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Expected staged EXT2 driver artifact missing: $path"
              }
          }
          Get-FileHash -Algorithm SHA256 -LiteralPath $driver, $cat | Format-Table
