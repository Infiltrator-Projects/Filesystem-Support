name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: filesystem-support-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-boundary:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce immutable source version identity
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "VERSION must contain major.minor.patch." >&2
            exit 1
          }

          tag_refs=$(git ls-remote --tags origin \
            "refs/tags/v${version}" "refs/tags/v${version}^{}")
          if [[ -n "$tag_refs" ]]; then
            tag_commit=$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<<"$tag_refs" | tail -n1)
            if [[ -z "$tag_commit" ]]; then
              tag_commit=$(awk 'NR == 1 { print $1 }' <<<"$tag_refs")
            fi
            head_commit=$(git rev-parse HEAD)
            if [[ "$tag_commit" != "$head_commit" ]]; then
              printf 'Source version %s is already tagged at %s; current main is %s. Advance VERSION before further development.\n' \
                "$version" "$tag_commit" "$head_commit" >&2
              exit 1
            fi
          fi

      - name: Enforce rewrite boundaries
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/shape-ext2.sh
          test ! -e tools/shape-ext3.sh
          test ! -e tools/shape-ext4.sh
          test ! -e tools/harden-ext-ranges.py

          refresh=.github/workflows/import-linux-filesystems.yml
          if test -f "$refresh"; then
            ! grep -Eq 'fs/ext2([ /]|$)|fs/ext3([ /]|$)|fs/ext4([ /]|$)|fs/affs([ /]|$)|linux-ext3|shape-ext[234]|harden-ext-ranges|recomment-ext-family' "$refresh"
            ! grep -Eq 'native/filesystems/(ext2|ext3|ext4|ofs|ffs|sfs|sfs2|pfs3)' "$refresh"
          fi

      - name: Verify rewritten EXT2 file layer provenance
        shell: bash
        run: |
          set -euo pipefail
          file=native/filesystems/ext2/linux/file.c
          grep -Fq 'Copyright (C) 2026 Shannon Smith' "$file"
          ! grep -Eiq 'linux/fs/ext2|Remy Card|Linus Torvalds|Stephen Tweedie|Red Hat' "$file"

      - name: Enforce single EXT2 engine on Windows
        shell: bash
        run: |
          set -euo pipefail
          test ! -e native/filesystems/ext2/windows/ext2_compat.h
          ! grep -R -E 'archive/extfs-for-windows|core/extfs(_classic_resize|_resize_dispatch)?\.c'               native/filesystems/ext2/windows windows/build CMakeLists.txt
          grep -Fq '..\core\ext2_core.c'               native/filesystems/ext2/windows/filesystem_support_ext2.vcxproj
          grep -Fq '..\core\ext2_engine.c'               native/filesystems/ext2/windows/filesystem_support_ext2.vcxproj
          grep -Fq '#include "../core/ext2_engine.h"'               native/filesystems/ext2/windows/ext2_driver.h

  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-ext2-module:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Linux 6.12.107 build API
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev
          git clone --depth 1 --branch v6.12.107 https://github.com/gregkh/linux.git /tmp/linux-6.12.107
          make -C /tmp/linux-6.12.107 defconfig
          /tmp/linux-6.12.107/scripts/config --file /tmp/linux-6.12.107/.config \
            --enable EXT2_FS_XATTR \
            --enable EXT2_FS_POSIX_ACL \
            --enable EXT2_FS_SECURITY \
            --enable FS_DAX
          make -C /tmp/linux-6.12.107 olddefconfig
          make -C /tmp/linux-6.12.107 modules_prepare

      - name: Build EXT2 kernel module
        shell: bash
        run: |
          set -euo pipefail
          # modules_prepare deliberately does not create Module.symvers.  This
          # job qualifies source/API compatibility against the pinned kernel;
          # load-time symbol qualification is performed against a built or
          # installed target kernel that supplies its real Module.symvers.
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/ext2/linux" \
            KBUILD_MODPOST_WARN=1 modules 2>&1 | tee /tmp/ext2-build.log
          test -s native/filesystems/ext2/linux/ext2.ko
          ! grep -Fq 'section mismatch' /tmp/ext2-build.log
          grep -Fq 'xattr.o' /tmp/ext2-build.log

  linux-ext3-module:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Linux 6.12.107 build API
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev
          git clone --depth 1 --branch v6.12.107 https://github.com/gregkh/linux.git /tmp/linux-6.12.107
          make -C /tmp/linux-6.12.107 defconfig
          make -C /tmp/linux-6.12.107 modules_prepare

      - name: Build EXT3 kernel module
        shell: bash
        run: |
          set -euo pipefail
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/ext3/linux" \
            KBUILD_MODPOST_WARN=1 modules 2>&1 | tee /tmp/ext3-build.log
          test -s native/filesystems/ext3/linux/ext3.ko
          ! grep -Fq 'section mismatch' /tmp/ext3-build.log

  linux-ext4-module:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Linux 6.12.107 build API
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev
          git clone --depth 1 --branch v6.12.107 https://github.com/gregkh/linux.git /tmp/linux-6.12.107
          make -C /tmp/linux-6.12.107 defconfig
          /tmp/linux-6.12.107/scripts/config --file /tmp/linux-6.12.107/.config \
            --enable EXT4_FS \
            --enable EXT4_FS_POSIX_ACL \
            --enable EXT4_FS_SECURITY \
            --enable FS_ENCRYPTION \
            --enable FS_VERITY \
            --enable QUOTA
          make -C /tmp/linux-6.12.107 olddefconfig
          make -C /tmp/linux-6.12.107 modules_prepare

      - name: Build EXT4 kernel module
        shell: bash
        run: |
          set -euo pipefail
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/ext4/linux" \
            KBUILD_MODPOST_WARN=1 modules 2>&1 | tee /tmp/ext4-build.log
          test -s native/filesystems/ext4/linux/ext4.ko
          ! grep -Fq 'section mismatch' /tmp/ext4-build.log
          grep -Fq 'crypto.o' /tmp/ext4-build.log
          grep -Fq 'verity.o' /tmp/ext4-build.log

  linux-ext-runtime-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kernel and runtime qualification dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libelf-dev libssl-dev \
            qemu-system-x86 busybox-static e2fsprogs cpio

      - name: Build a pinned Linux kernel without native EXT drivers
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v6.12.107 https://github.com/gregkh/linux.git /tmp/linux-6.12.107
          make -C /tmp/linux-6.12.107 defconfig
          /tmp/linux-6.12.107/scripts/config --file /tmp/linux-6.12.107/.config \
            --disable EXT2_FS \
            --disable EXT3_FS \
            --disable EXT4_FS \
            --enable BLK_DEV_INITRD \
            --enable DEVTMPFS \
            --enable DEVTMPFS_MOUNT \
            --enable VIRTIO \
            --enable VIRTIO_PCI \
            --enable VIRTIO_BLK \
            --enable SERIAL_8250 \
            --enable SERIAL_8250_CONSOLE \
            --enable TMPFS \
            --enable QUOTA \
            --enable FS_ENCRYPTION \
            --enable FS_VERITY
          make -C /tmp/linux-6.12.107 olddefconfig
          make -C /tmp/linux-6.12.107 -j"$(nproc)" bzImage modules
          test -s /tmp/linux-6.12.107/Module.symvers

      - name: Build EXT modules against the real kernel symbol table
        shell: bash
        run: |
          set -euo pipefail
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/ext2/linux" \
            CONFIG_EXT2_FS_XATTR=y \
            CONFIG_EXT2_FS_POSIX_ACL=y \
            CONFIG_EXT2_FS_SECURITY=y \
            modules
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/ext3/linux" \
            modules
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/ext4/linux" \
            CONFIG_FS_ENCRYPTION=y \
            CONFIG_FS_VERITY=y \
            modules

          test -s native/filesystems/ext2/linux/ext2.ko
          test -s native/filesystems/ext3/linux/ext3.ko
          test -s native/filesystems/ext4/linux/ext4.ko

      - name: Create independently manufactured EXT media
        shell: bash
        run: |
          set -euo pipefail
          truncate -s 128M /tmp/ext2.img
          truncate -s 128M /tmp/ext3.img
          truncate -s 128M /tmp/ext4.img
          mkfs.ext2 -F -L IFS_EXT2 /tmp/ext2.img
          mkfs.ext3 -F -L IFS_EXT3 /tmp/ext3.img
          mkfs.ext4 -F -L IFS_EXT4 /tmp/ext4.img

      - name: Build qualification initramfs
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/ext-qual-root
          rm -rf "$root"
          mkdir -p "$root"/{bin,proc,sys,dev,mnt/ext2,mnt/ext3,mnt/ext4}
          cp /usr/bin/busybox "$root/bin/busybox"
          for app in sh mount umount mkdir cat echo dd ln mv sync poweroff insmod ls stat; do
            ln -s busybox "$root/bin/$app"
          done

          cp native/filesystems/ext2/linux/ext2.ko "$root/ext2.ko"
          cp native/filesystems/ext3/linux/ext3.ko "$root/ext3.ko"
          cp native/filesystems/ext4/linux/ext4.ko "$root/ext4.ko"

          cat > "$root/init" <<'EOF'
          #!/bin/sh
          set -eu

          fail()
          {
              echo "EXT-RUNTIME-FAIL: $*" > /dev/ttyS0
              poweroff -f
              exit 1
          }

          mount -t proc proc /proc || fail "proc"
          mount -t sysfs sysfs /sys || fail "sysfs"
          mount -t devtmpfs devtmpfs /dev || fail "devtmpfs"

          # All three modules must coexist.  This catches duplicate private
          # helper/JBD/cache symbols as well as registration conflicts.
          insmod /ext2.ko || fail "insmod ext2"
          insmod /ext3.ko || fail "insmod ext3"
          insmod /ext4.ko || fail "insmod ext4"

          qualify()
          {
              fs="$1"
              dev="$2"
              mnt="/mnt/$fs"

              mount -t "$fs" "$dev" "$mnt" || fail "mount $fs"
              echo "Filesystem Support $fs runtime qualification" > "$mnt/root.txt" ||
                  fail "write $fs"
              mkdir "$mnt/tree" || fail "mkdir $fs"
              dd if=/dev/zero of="$mnt/tree/payload.bin" bs=4096 count=32 ||
                  fail "payload $fs"
              ln "$mnt/root.txt" "$mnt/tree/hardlink.txt" || fail "hardlink $fs"
              ln -s ../root.txt "$mnt/tree/symlink.txt" || fail "symlink $fs"
              mv "$mnt/tree/payload.bin" "$mnt/tree/renamed.bin" || fail "rename $fs"
              sync
              test "$(cat "$mnt/tree/hardlink.txt")" = "Filesystem Support $fs runtime qualification" ||
                  fail "readback $fs"
              umount "$mnt" || fail "unmount $fs"
          }

          qualify ext2 /dev/vda
          qualify ext3 /dev/vdb
          qualify ext4 /dev/vdc

          echo "EXT-RUNTIME-PASS" > /dev/ttyS0
          poweroff -f
          EOF
          chmod +x "$root/init"

          (cd "$root" && find . -print0 | cpio --null -ov --format=newc | gzip -9) > /tmp/ext-qual-initramfs.cpio.gz

      - name: Boot the modules and exercise real EXT media
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 qemu-system-x86_64 \
            -machine accel=tcg \
            -m 768 \
            -nographic \
            -no-reboot \
            -kernel /tmp/linux-6.12.107/arch/x86/boot/bzImage \
            -initrd /tmp/ext-qual-initramfs.cpio.gz \
            -append 'console=ttyS0 panic=1 rdinit=/init' \
            -drive file=/tmp/ext2.img,format=raw,if=virtio \
            -drive file=/tmp/ext3.img,format=raw,if=virtio \
            -drive file=/tmp/ext4.img,format=raw,if=virtio \
            2>&1 | tee /tmp/ext-runtime.log

          grep -Fq 'EXT-RUNTIME-PASS' /tmp/ext-runtime.log
          ! grep -Fq 'EXT-RUNTIME-FAIL' /tmp/ext-runtime.log

      - name: Verify written media independently with e2fsck
        shell: bash
        run: |
          set -euo pipefail
          e2fsck -fn /tmp/ext2.img
          e2fsck -fn /tmp/ext3.img
          e2fsck -fn /tmp/ext4.img

  linux-amiga-ofs-ffs-modules:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Linux 6.12.107 build API
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev
          git clone --depth 1 --branch v6.12.107 https://github.com/gregkh/linux.git /tmp/linux-6.12.107
          make -C /tmp/linux-6.12.107 defconfig
          make -C /tmp/linux-6.12.107 modules_prepare

      - name: Build independent OFS module
        shell: bash
        run: |
          set -euo pipefail
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/ofs/linux" \
            KBUILD_MODPOST_WARN=1 modules
          test -s native/filesystems/ofs/linux/ofs.ko

      - name: Build independent FFS module
        shell: bash
        run: |
          set -euo pipefail
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/ffs/linux" \
            KBUILD_MODPOST_WARN=1 modules
          test -s native/filesystems/ffs/linux/ffs.ko


  windows-manager:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: powershell
        run: cmake -S . -B build-windows -A x64 -DBUILD_TESTING=OFF

      - name: Build
        shell: powershell
        run: cmake --build build-windows --config Release

      - name: Verify manager
        shell: powershell
        run: |
          $manager = Get-ChildItem -LiteralPath build-windows -Filter filesystem-support.exe -File -Recurse |
              Select-Object -First 1
          if (-not $manager) {
              throw 'Windows Filesystem Support manager was not produced.'
          }
          Write-Host "Manager: $($manager.FullName)"

  windows-ext2-driver:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and validate canonical EXT2 driver
        shell: powershell
        run: .\windows\build\Build-Ext2Driver.ps1 -Configuration Release -Platform x64 -SkipCodeAnalysis

      - name: Verify staged driver package
        shell: powershell
        run: |
          $driver = 'release\windows\ext2\x64\filesystem_support_ext2.sys'
          $inf = 'release\windows\ext2\x64\filesystem_support_ext2.inf'
          $cat = 'release\windows\ext2\x64\filesystem_support_ext2.cat'
          foreach ($path in @($driver, $inf, $cat)) {
              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Expected staged EXT2 driver artifact missing: $path"
              }
          }
          Get-FileHash -Algorithm SHA256 -LiteralPath $driver, $cat | Format-Table
