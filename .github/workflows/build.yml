name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  source-boundary:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce retired upstream import path
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/import-linux-filesystems.yml
          test ! -e tools/shape-ext2.sh
          test ! -e tools/shape-ext3.sh
          test ! -e tools/shape-ext4.sh
          test ! -e tools/harden-ext-ranges.py

      - name: Verify rewritten EXT2 file layer provenance
        shell: bash
        run: |
          set -euo pipefail
          file=native/filesystems/ext2/kernel/file.c
          grep -Fq 'Copyright (C) 2026 Shannon Smith' "$file"
          ! grep -Eiq 'linux/fs/ext2|Remy Card|Linus Torvalds|Stephen Tweedie|Red Hat' "$file"

  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-ext2-module:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-headers-generic

      - name: Build EXT2 kernel module
        shell: bash
        run: |
          set -euo pipefail
          KDIR="$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)"
          test -n "$KDIR"
          make -C "$KDIR" M="$PWD/native/filesystems/ext2/kernel" modules

  windows-manager:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: powershell
        run: cmake -S . -B build-windows -A x64 -DBUILD_TESTING=OFF

      - name: Build
        shell: powershell
        run: cmake --build build-windows --config Release

      - name: Verify manager
        shell: powershell
        run: |
          $manager = Get-ChildItem -LiteralPath build-windows -Filter filesystem-support.exe -File -Recurse |
              Select-Object -First 1
          if (-not $manager) {
              throw 'Windows Filesystem Support manager was not produced.'
          }
          Write-Host "Manager: $($manager.FullName)"

  windows-ext2-driver:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and validate canonical EXT2 driver
        shell: powershell
        run: .\windows\build\Build-Ext2Driver.ps1 -Configuration Release -Platform x64 -SkipCodeAnalysis

      - name: Verify staged driver package
        shell: powershell
        run: |
          $driver = 'release\windows\ext2\x64\filesystem_support_ext2.sys'
          $inf = 'release\windows\ext2\x64\filesystem_support_ext2.inf'
          $cat = 'release\windows\ext2\x64\filesystem_support_ext2.cat'
          foreach ($path in @($driver, $inf, $cat)) {
              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Expected staged EXT2 driver artifact missing: $path"
              }
          }
          Get-FileHash -Algorithm SHA256 -LiteralPath $driver, $cat | Format-Table
