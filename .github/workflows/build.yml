name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  source-boundary:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce retired upstream import path
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/import-linux-filesystems.yml
          test ! -e tools/shape-ext2.sh
          test ! -e tools/shape-ext3.sh
          test ! -e tools/shape-ext4.sh
          test ! -e tools/harden-ext-ranges.py

      - name: Verify rewritten EXT2 file layer provenance
        shell: bash
        run: |
          set -euo pipefail
          file=native/filesystems/ext2/kernel/file.c
          grep -Fq 'Copyright (C) 2026 Shannon Smith' "$file"
          ! grep -Eiq 'linux/fs/ext2|Remy Card|Linus Torvalds|Stephen Tweedie|Red Hat' "$file"

      - name: Enforce single EXT2 engine on Windows
        shell: bash
        run: |
          set -euo pipefail
          test ! -e windows/driver/ext2/ext2_compat.h
          ! grep -R -E 'archive/extfs-for-windows|core/extfs(_classic_resize|_resize_dispatch)?\.c'               windows/driver windows/build CMakeLists.txt
          grep -Fq '../../../native/filesystems/ext2/core/ext2_core.c'               windows/driver/ext2/filesystem_support_ext2.vcxproj
          grep -Fq '../../../native/filesystems/ext2/core/ext2_engine.c'               windows/driver/ext2/filesystem_support_ext2.vcxproj
          grep -Fq '#include "../../../native/filesystems/ext2/core/ext2_engine.h"'               windows/driver/ext2/ext2_driver.h

  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-ext2-module:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Linux 6.12.107 build API
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev
          git clone --depth 1 --branch v6.12.107 https://github.com/gregkh/linux.git /tmp/linux-6.12.107
          make -C /tmp/linux-6.12.107 defconfig
          make -C /tmp/linux-6.12.107 modules_prepare

      - name: Build EXT2 kernel module
        shell: bash
        run: |
          set -euo pipefail
          make -C /tmp/linux-6.12.107 M="$PWD/native/filesystems/ext2/kernel" modules

  windows-manager:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: powershell
        run: cmake -S . -B build-windows -A x64 -DBUILD_TESTING=OFF

      - name: Build
        shell: powershell
        run: cmake --build build-windows --config Release

      - name: Verify manager
        shell: powershell
        run: |
          $manager = Get-ChildItem -LiteralPath build-windows -Filter filesystem-support.exe -File -Recurse |
              Select-Object -First 1
          if (-not $manager) {
              throw 'Windows Filesystem Support manager was not produced.'
          }
          Write-Host "Manager: $($manager.FullName)"

  windows-ext2-driver:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and validate canonical EXT2 driver
        shell: powershell
        run: .\windows\build\Build-Ext2Driver.ps1 -Configuration Release -Platform x64 -SkipCodeAnalysis

      - name: Verify staged driver package
        shell: powershell
        run: |
          $driver = 'release\windows\ext2\x64\filesystem_support_ext2.sys'
          $inf = 'release\windows\ext2\x64\filesystem_support_ext2.inf'
          $cat = 'release\windows\ext2\x64\filesystem_support_ext2.cat'
          foreach ($path in @($driver, $inf, $cat)) {
              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Expected staged EXT2 driver artifact missing: $path"
              }
          }
          Get-FileHash -Algorithm SHA256 -LiteralPath $driver, $cat | Format-Table
