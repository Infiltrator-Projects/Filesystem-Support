name: EXT runtime qualification

on:
  workflow_run:
    workflows: ["build"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: filesystem-support-ext-runtime
  # Only the newest main commit is useful during the chunk-by-chunk rewrite.
  cancel-in-progress: true

jobs:
  linux-ext-runtime-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout qualified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install kernel and runtime qualification dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libelf-dev libssl-dev \
            qemu-system-x86 busybox-static e2fsprogs cpio

      - name: Build a pinned Linux kernel without native EXT drivers
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v6.12.107 https://github.com/gregkh/linux.git /tmp/linux-6.12.107
          make -C /tmp/linux-6.12.107 defconfig
          /tmp/linux-6.12.107/scripts/config --file /tmp/linux-6.12.107/.config \
            --disable EXT2_FS \
            --disable EXT3_FS \
            --disable EXT4_FS \
            --enable BLK_DEV_INITRD \
            --enable DEVTMPFS \
            --enable DEVTMPFS_MOUNT \
            --enable VIRTIO \
            --enable VIRTIO_PCI \
            --enable VIRTIO_BLK \
            --enable SERIAL_8250 \
            --enable SERIAL_8250_CONSOLE \
            --enable TMPFS \
            --enable QUOTA \
            --enable FS_ENCRYPTION \
            --enable FS_VERITY
          make -C /tmp/linux-6.12.107 olddefconfig
          make -C /tmp/linux-6.12.107 -j"$(nproc)" bzImage modules
          test -s /tmp/linux-6.12.107/Module.symvers

      - name: Build EXT modules against the real kernel symbol table
        shell: bash
        run: |
          set -euo pipefail
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/ext2/linux" \
            modules
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/ext3/linux" \
            modules
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/ext4/linux" \
            CONFIG_FS_ENCRYPTION=y \
            CONFIG_FS_VERITY=y \
            modules
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/ofs/linux" \
            modules
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/ffs/linux" \
            modules
          make -C /tmp/linux-6.12.107 \
            M="$PWD/native/filesystems/sfs/linux" \
            modules

          test -s native/filesystems/ext2/linux/ext2.ko
          test -s native/filesystems/ext3/linux/ext3.ko
          test -s native/filesystems/ext4/linux/ext4.ko
          test -s native/filesystems/ofs/linux/ofs.ko
          test -s native/filesystems/ffs/linux/ffs.ko
          test -s native/filesystems/sfs/linux/sfs.ko

      - name: Create independently manufactured EXT media
        shell: bash
        run: |
          set -euo pipefail
          truncate -s 128M /tmp/ext2.img
          truncate -s 128M /tmp/ext3.img
          truncate -s 128M /tmp/ext4.img
          mkfs.ext2 -F -L IFS_EXT2 /tmp/ext2.img
          mkfs.ext3 -F -L IFS_EXT3 /tmp/ext3.img
          mkfs.ext4 -F -L IFS_EXT4 /tmp/ext4.img

      - name: Build qualification initramfs
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/ext-qual-root
          rm -rf "$root"
          mkdir -p "$root"/{bin,proc,sys,dev,mnt/ext2,mnt/ext3,mnt/ext4}
          cp /usr/bin/busybox "$root/bin/busybox"
          for app in sh mount umount mkdir cat echo dd ln mv sync poweroff insmod ls stat; do
            ln -s busybox "$root/bin/$app"
          done

          cp native/filesystems/ext2/linux/ext2.ko "$root/ext2.ko"
          cp native/filesystems/ext3/linux/ext3.ko "$root/ext3.ko"
          cp native/filesystems/ext4/linux/ext4.ko "$root/ext4.ko"
          cp native/filesystems/ofs/linux/ofs.ko "$root/ofs.ko"
          cp native/filesystems/ffs/linux/ffs.ko "$root/ffs.ko"
          cp native/filesystems/sfs/linux/sfs.ko "$root/sfs.ko"

          cat > "$root/init" <<'EOF'
          #!/bin/sh
          set -eu

          fail()
          {
              echo "EXT-RUNTIME-FAIL: $*" > /dev/ttyS0
              poweroff -f
              exit 1
          }

          mount -t proc proc /proc || fail "proc"
          mount -t sysfs sysfs /sys || fail "sysfs"
          mount -t devtmpfs devtmpfs /dev || fail "devtmpfs"

          # All three modules must coexist.  This catches duplicate private
          # helper/JBD/cache symbols as well as registration conflicts.
          insmod /ext2.ko || fail "insmod ext2"
          insmod /ext3.ko || fail "insmod ext3"
          insmod /ext4.ko || fail "insmod ext4"
          insmod /ofs.ko || fail "insmod ofs"
          insmod /ffs.ko || fail "insmod ffs"
          insmod /sfs.ko || fail "insmod sfs"

          qualify()
          {
              fs="$1"
              dev="$2"
              mnt="/mnt/$fs"

              mount -t "$fs" "$dev" "$mnt" || fail "mount $fs"
              echo "Filesystem Support $fs runtime qualification" > "$mnt/root.txt" ||
                  fail "write $fs"
              mkdir "$mnt/tree" || fail "mkdir $fs"
              dd if=/dev/zero of="$mnt/tree/payload.bin" bs=4096 count=32 ||
                  fail "payload $fs"
              ln "$mnt/root.txt" "$mnt/tree/hardlink.txt" || fail "hardlink $fs"
              ln -s ../root.txt "$mnt/tree/symlink.txt" || fail "symlink $fs"
              mv "$mnt/tree/payload.bin" "$mnt/tree/renamed.bin" || fail "rename $fs"
              sync
              test "$(cat "$mnt/tree/hardlink.txt")" = "Filesystem Support $fs runtime qualification" ||
                  fail "readback $fs"
              umount "$mnt" || fail "unmount $fs"
          }

          qualify ext2 /dev/vda
          qualify ext3 /dev/vdb
          qualify ext4 /dev/vdc

          echo "EXT-RUNTIME-PASS" > /dev/ttyS0
          poweroff -f
          EOF
          chmod +x "$root/init"

          (cd "$root" && find . -print0 | cpio --null -ov --format=newc | gzip -9) > /tmp/ext-qual-initramfs.cpio.gz

      - name: Boot the modules and exercise real EXT media
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 qemu-system-x86_64 \
            -machine accel=tcg \
            -m 768 \
            -nographic \
            -no-reboot \
            -kernel /tmp/linux-6.12.107/arch/x86/boot/bzImage \
            -initrd /tmp/ext-qual-initramfs.cpio.gz \
            -append 'console=ttyS0 panic=1 rdinit=/init' \
            -drive file=/tmp/ext2.img,format=raw,if=virtio \
            -drive file=/tmp/ext3.img,format=raw,if=virtio \
            -drive file=/tmp/ext4.img,format=raw,if=virtio \
            2>&1 | tee /tmp/ext-runtime.log

          grep -Fq 'EXT-RUNTIME-PASS' /tmp/ext-runtime.log
          ! grep -Fq 'EXT-RUNTIME-FAIL' /tmp/ext-runtime.log

      - name: Verify written media independently with e2fsck
        shell: bash
        run: |
          set -euo pipefail
          e2fsck -fn /tmp/ext2.img
          e2fsck -fn /tmp/ext3.img
          e2fsck -fn /tmp/ext4.img

      - name: Qualify EXT4 orphan recovery in both on-disk formats
        shell: bash
        run: |
          set -euo pipefail

          make_image()
          {
              image="$1"
              feature="$2"
              truncate -s 128M "$image"
              mkfs.ext4 -F -O "$feature" "$image"
          }

          make_image /tmp/ext4-orphan-file.img orphan_file
          make_image /tmp/ext4-orphan-list.img ^orphan_file

          crash_root=/tmp/ext4-orphan-crash-root
          rm -rf "$crash_root"
          mkdir -p "$crash_root"/{bin,proc,sys,dev,mnt}
          cp /usr/bin/busybox "$crash_root/bin/busybox"
          for app in sh mount mkdir dd sync insmod rm reboot; do
            ln -s busybox "$crash_root/bin/$app"
          done
          cp native/filesystems/ext4/linux/ext4.ko "$crash_root/ext4.ko"

          cat > "$crash_root/init" <<'EOF'
          #!/bin/sh
          set -eu

          fail()
          {
              echo "EXT4-ORPHAN-CRASH-FAIL: $*" > /dev/ttyS0
              /bin/busybox poweroff -f
              exit 1
          }

          mount -t proc proc /proc || fail proc
          mount -t sysfs sysfs /sys || fail sysfs
          mount -t devtmpfs devtmpfs /dev || fail devtmpfs
          insmod /ext4.ko || fail insmod
          mount -t ext4 /dev/vda /mnt || fail mount
          exec 3>/mnt/orphan-target
          dd if=/dev/zero bs=4096 count=64 >&3 || fail payload
          rm /mnt/orphan-target || fail unlink
          echo post-unlink-data >&3 || fail open-write
          sync || fail sync
          echo "EXT4-ORPHAN-CRASH-ARMED" > /dev/ttyS0
          /bin/busybox reboot -f
          fail reboot-returned
          EOF
          chmod +x "$crash_root/init"
          (cd "$crash_root" && find . -print0 | cpio --null -ov --format=newc | gzip -9) \
            > /tmp/ext4-orphan-crash-initramfs.cpio.gz

          recover_root=/tmp/ext4-orphan-recover-root
          rm -rf "$recover_root"
          mkdir -p "$recover_root"/{bin,proc,sys,dev,mnt}
          cp /usr/bin/busybox "$recover_root/bin/busybox"
          for app in sh mount umount cat echo sync insmod ls test poweroff; do
            ln -s busybox "$recover_root/bin/$app"
          done
          cp native/filesystems/ext4/linux/ext4.ko "$recover_root/ext4.ko"

          cat > "$recover_root/init" <<'EOF'
          #!/bin/sh
          set -eu

          fail()
          {
              echo "EXT4-ORPHAN-RECOVERY-FAIL: $*" > /dev/ttyS0
              poweroff -f
              exit 1
          }

          mount -t proc proc /proc || fail proc
          mount -t sysfs sysfs /sys || fail sysfs
          mount -t devtmpfs devtmpfs /dev || fail devtmpfs
          insmod /ext4.ko || fail insmod
          mount -t ext4 /dev/vda /mnt || fail mount
          test ! -e /mnt/orphan-target || fail namespace
          echo recovered > /mnt/recovery-marker || fail write
          sync || fail sync
          umount /mnt || fail unmount
          echo "EXT4-ORPHAN-RECOVERY-PASS" > /dev/ttyS0
          poweroff -f
          EOF
          chmod +x "$recover_root/init"
          (cd "$recover_root" && find . -print0 | cpio --null -ov --format=newc | gzip -9) \
            > /tmp/ext4-orphan-recover-initramfs.cpio.gz

          qualify_orphan_image()
          {
              image="$1"
              label="$2"

              timeout 120 qemu-system-x86_64 \
                -machine accel=tcg \
                -m 768 \
                -nographic \
                -no-reboot \
                -kernel /tmp/linux-6.12.107/arch/x86/boot/bzImage \
                -initrd /tmp/ext4-orphan-crash-initramfs.cpio.gz \
                -append 'console=ttyS0 panic=1 rdinit=/init' \
                -drive file="$image",format=raw,if=virtio \
                2>&1 | tee "/tmp/${label}-crash.log"
              grep -Fq 'EXT4-ORPHAN-CRASH-ARMED' "/tmp/${label}-crash.log"
              ! grep -Fq 'EXT4-ORPHAN-CRASH-FAIL' "/tmp/${label}-crash.log"

              timeout 120 qemu-system-x86_64 \
                -machine accel=tcg \
                -m 768 \
                -nographic \
                -no-reboot \
                -kernel /tmp/linux-6.12.107/arch/x86/boot/bzImage \
                -initrd /tmp/ext4-orphan-recover-initramfs.cpio.gz \
                -append 'console=ttyS0 panic=1 rdinit=/init' \
                -drive file="$image",format=raw,if=virtio \
                2>&1 | tee "/tmp/${label}-recover.log"
              grep -Fq 'EXT4-ORPHAN-RECOVERY-PASS' "/tmp/${label}-recover.log"
              ! grep -Fq 'EXT4-ORPHAN-RECOVERY-FAIL' "/tmp/${label}-recover.log"

              e2fsck -fn "$image"
          }

          qualify_orphan_image /tmp/ext4-orphan-file.img orphan-file
          qualify_orphan_image /tmp/ext4-orphan-list.img orphan-list
