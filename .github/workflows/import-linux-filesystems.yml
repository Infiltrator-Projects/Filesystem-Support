name: Import Linux filesystem drivers

on:
  push:
    paths:
      - .github/import-linux-drivers.trigger

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Filesystem Support
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pinned Linux filesystem sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --depth 1 --branch v6.12.107 \
            https://github.com/gregkh/linux.git /tmp/linux
          git -C /tmp/linux sparse-checkout init --cone
          git -C /tmp/linux sparse-checkout set \
            fs/ext2 fs/ext4 fs/jbd2 fs/xfs fs/btrfs fs/f2fs fs/jfs fs/nilfs2 fs/reiserfs \
            fs/erofs fs/minix fs/romfs fs/cramfs fs/squashfs fs/bcachefs \
            fs/overlayfs fs/ecryptfs fs/jffs2 fs/ubifs fs/zonefs fs/gfs2 \
            fs/ocfs2 fs/adfs fs/affs fs/befs fs/bfs fs/efs fs/hpfs fs/qnx4 \
            fs/qnx6 fs/sysv fs/ufs fs/omfs fs/fat fs/exfat fs/ntfs3 fs/hfs \
            fs/hfsplus fs/isofs fs/udf fs/fuse fs/smb/client fs/smb/common \
            fs/nfs fs/ceph fs/9p fs/orangefs
          git -C /tmp/linux checkout

      - name: Copy working driver sources into active native trees
        shell: bash
        run: |
          set -euo pipefail

          copy_tree() {
            local source_path="$1"
            local destination="$2"
            rm -rf "$destination"
            mkdir -p "$destination"
            cp -a "/tmp/linux/$source_path/." "$destination/"
          }

          embed_mbcache() {
            local destination="$1"
            mkdir -p "$destination/include/linux"
            git -C /tmp/linux show HEAD:fs/mbcache.c > "$destination/mbcache.c"
            git -C /tmp/linux show HEAD:include/linux/mbcache.h > "$destination/include/linux/mbcache.h"

            sed -i \
              -e 's/static int __init mbcache_init(void)/int __init infiltratr_mbcache_init(void)/' \
              -e 's/static void __exit mbcache_exit(void)/void __exit infiltratr_mbcache_exit(void)/' \
              -e '/^module_init(mbcache_init)$/d' \
              -e '/^module_exit(mbcache_exit)$/d' \
              -e '/^MODULE_AUTHOR(/d' \
              -e '/^MODULE_DESCRIPTION(/d' \
              -e '/^MODULE_LICENSE(/d' \
              -e '/^[[:space:]]*EXPORT_SYMBOL/d' \
              "$destination/mbcache.c"
          }

          embed_jbd2() {
            local destination="$1"
            mkdir -p "$destination/include/linux" "$destination/include/trace/events"

            for source in checkpoint commit journal recovery revoke transaction; do
              cp "/tmp/linux/fs/jbd2/${source}.c" "$destination/jbd2_${source}.c"
              sed -i '/^[[:space:]]*EXPORT_SYMBOL/d' "$destination/jbd2_${source}.c"
            done

            git -C /tmp/linux show HEAD:include/linux/jbd2.h > "$destination/include/linux/jbd2.h"
            git -C /tmp/linux show HEAD:include/trace/events/jbd2.h > "$destination/include/trace/events/jbd2.h"

            # Each filesystem owns its embedded journal code. It is not a
            # second kernel module and therefore must not have its own
            # module_init/module_exit or exported symbol namespace.
            sed -i \
              -e 's/static int __init journal_init(void)/int __init infiltratr_jbd2_init(void)/' \
              -e 's/static void __exit journal_exit(void)/void __exit infiltratr_jbd2_exit(void)/' \
              -e '/^module_init(journal_init);$/d' \
              -e '/^module_exit(journal_exit);$/d' \
              -e '/^MODULE_DESCRIPTION(/d' \
              -e '/^MODULE_LICENSE(/d' \
              "$destination/jbd2_journal.c"

            # Do not create a shared /proc/fs/jbd2 endpoint from two separate
            # filesystem modules.
            perl -0pi -e 's/\n\tif \(ret == 0\) \{\n\t\tjbd2_create_jbd_stats_proc_entry\(\);\n\t\} else \{\n\t\tjbd2_journal_destroy_caches\(\);\n\t\}/\n\tif (ret != 0)\n\t\tjbd2_journal_destroy_caches();/s' "$destination/jbd2_journal.c"
            sed -i '/^[[:space:]]*jbd2_remove_jbd_stats_proc_entry();$/d' "$destination/jbd2_journal.c"
          }

          add_ext2_embedded_support() {
            local destination="$1"
            embed_mbcache "$destination"
            printf '%s\n' \
              '' \
              '# Infiltrator: mbcache is part of ext2.ko only when EXT2 xattrs are enabled.' \
              'ext2-$(CONFIG_EXT2_FS_XATTR) += mbcache.o' \
              'ccflags-y += -I$(src)/include' \
              >> "$destination/Makefile"

            perl -0pi -e 's/static int __init init_ext2_fs\(void\)/static int __init ext2_core_init_fs(void)/' "$destination/super.c"
            perl -0pi -e 's/static void __exit exit_ext2_fs\(void\)/static void __exit ext2_core_exit_fs(void)/' "$destination/super.c"
            perl -0pi -e 's/module_init\(init_ext2_fs\)\nmodule_exit\(exit_ext2_fs\)/#ifdef CONFIG_EXT2_FS_XATTR\nint infiltratr_mbcache_init(void);\nvoid infiltratr_mbcache_exit(void);\nstatic int ext2_mbcache_init(void) { return infiltratr_mbcache_init(); }\nstatic void ext2_mbcache_exit(void) { infiltratr_mbcache_exit(); }\n#else\nstatic int ext2_mbcache_init(void) { return 0; }\nstatic void ext2_mbcache_exit(void) { }\n#endif\n\nstatic int __init init_ext2_fs(void)\n{\n\tint err = ext2_mbcache_init();\n\tif (err)\n\t\treturn err;\n\terr = ext2_core_init_fs();\n\tif (err)\n\t\text2_mbcache_exit();\n\treturn err;\n}\n\nstatic void __exit exit_ext2_fs(void)\n{\n\text2_core_exit_fs();\n\text2_mbcache_exit();\n}\n\nmodule_init(init_ext2_fs)\nmodule_exit(exit_ext2_fs)/s' "$destination/super.c"
          }

          add_ext34_embedded_support() {
            local destination="$1"
            local module_name="$2"

            embed_mbcache "$destination"
            embed_jbd2 "$destination"

            printf '%s\n' \
              '' \
              "# Infiltrator: JBD2 and mbcache are linked into ${module_name}.ko." \
              '# No jbd2.ko or mbcache.ko is produced.' \
              "${module_name}-y += mbcache.o jbd2_transaction.o jbd2_commit.o \\" \
              '    jbd2_recovery.o jbd2_checkpoint.o jbd2_revoke.o jbd2_journal.o' \
              'ccflags-y += -I$(src)/include' \
              >> "$destination/Makefile"

            # Give the embedded trace-events namespace to the owning filesystem
            # so EXT3 and EXT4 can coexist without sharing a trace system.
            sed -i "s/^#define TRACE_SYSTEM jbd2/#define TRACE_SYSTEM infiltratr_${module_name}_jbd2/" \
              "$destination/include/trace/events/jbd2.h"

            local core_init="${module_name}_core_init_fs"
            local core_exit="${module_name}_core_exit_fs"
            local module_init_name="${module_name}_init_fs"
            local module_exit_name="${module_name}_exit_fs"

            perl -0pi -e "s/static int __init ext4_init_fs\\(void\\)/static int __init ${core_init}(void)/" "$destination/super.c"
            perl -0pi -e "s/static void __exit ext4_exit_fs\\(void\\)/static void __exit ${core_exit}(void)/" "$destination/super.c"
            perl -0pi -e "s/module_init\\(ext4_init_fs\\)\\nmodule_exit\\(ext4_exit_fs\\)/int infiltratr_mbcache_init(void);\\nvoid infiltratr_mbcache_exit(void);\\nint infiltratr_jbd2_init(void);\\nvoid infiltratr_jbd2_exit(void);\\n\\nstatic int __init ${module_init_name}(void)\\n{\\n\\tint err = infiltratr_mbcache_init();\\n\\tif (err)\\n\\t\\treturn err;\\n\\terr = infiltratr_jbd2_init();\\n\\tif (err) {\\n\\t\\tinfiltratr_mbcache_exit();\\n\\t\\treturn err;\\n\\t}\\n\\terr = ${core_init}();\\n\\tif (err) {\\n\\t\\tinfiltratr_jbd2_exit();\\n\\t\\tinfiltratr_mbcache_exit();\\n\\t}\\n\\treturn err;\\n}\\n\\nstatic void __exit ${module_exit_name}(void)\\n{\\n\\t${core_exit}();\\n\\tinfiltratr_jbd2_exit();\\n\\tinfiltratr_mbcache_exit();\\n}\\n\\nmodule_init(${module_init_name})\\nmodule_exit(${module_exit_name})/s" "$destination/super.c"
          }

          # EXT2, EXT3 and EXT4 are deliberately independent source trees.
          # Duplication is intentional for now. Each tree builds exactly one
          # filesystem module with its required support code embedded into it.
          rm -rf native/filesystems/ext
          rm -rf native/filesystems/ext2/support native/filesystems/ext3/support native/filesystems/ext4/support

          copy_tree fs/ext2 native/filesystems/ext2/kernel

          # EXT2 is intentionally strict and self-contained. Remove upstream
          # integration/debug material that is not part of the filesystem
          # implementation we are carrying.
          rm -f \
            native/filesystems/ext2/kernel/Kconfig \
            native/filesystems/ext2/kernel/trace.c \
            native/filesystems/ext2/kernel/trace.h

          sed -i \
            -e 's/ symlink.o trace.o/ symlink.o/' \
            -e '/For tracepoints to include our trace.h/d' \
            -e '/^CFLAGS_trace.o/d' \
            -e 's/obj-$(CONFIG_EXT2_FS) += ext2.o/obj-m += ext2.o/' \
            native/filesystems/ext2/kernel/Makefile

          sed -i \
            -e '/#include "trace.h"/d' \
            -e '/trace_ext2_dio_/d' \
            native/filesystems/ext2/kernel/file.c

          perl -0pi -e 's/\n    \/\* Not used by ext2, but reserved for use by ext3 \*\/\n#define EXT3_DEFM_JMODE\s+0x0060\s*\n#define EXT3_DEFM_JMODE_DATA\s+0x0020\s*\n#define EXT3_DEFM_JMODE_ORDERED\s+0x0040\s*\n#define EXT3_DEFM_JMODE_WBACK\s+0x0060\s*\n/\n/s' \
            native/filesystems/ext2/kernel/ext2.h

          perl -0pi -e 's/(features = EXT2_HAS_INCOMPAT_FEATURE\(sb, ~EXT2_FEATURE_INCOMPAT_SUPP\);\n\tif \(features\) \{.*?\n\t\}\n)/$1\tif (EXT2_HAS_COMPAT_FEATURE(sb, EXT3_FEATURE_COMPAT_HAS_JOURNAL)) {\n\t\text2_msg(sb, KERN_ERR, "error: journalled filesystem is not EXT2");\n\t\tgoto failed_mount;\n\t}\n/s' \
            native/filesystems/ext2/kernel/super.c
          perl -0pi -e 's/\n\tif \(EXT2_HAS_COMPAT_FEATURE\(sb, EXT3_FEATURE_COMPAT_HAS_JOURNAL\)\)\n\t\text2_msg\(sb, KERN_WARNING,\n\t\t\t"warning: mounting ext3 filesystem as ext2"\);//s' \
            native/filesystems/ext2/kernel/super.c

          add_ext2_embedded_support native/filesystems/ext2/kernel

          # Forensic invariants: EXT2 must remain only EXT2.
          test ! -e native/filesystems/ext2/kernel/Kconfig
          test ! -e native/filesystems/ext2/kernel/trace.c
          test ! -e native/filesystems/ext2/kernel/trace.h
          ! grep -R -n 'trace_ext2_dio_' native/filesystems/ext2/kernel
          ! grep -R -n 'EXT3_DEFM_JMODE' native/filesystems/ext2/kernel
          grep -Fq 'error: journalled filesystem is not EXT2' native/filesystems/ext2/kernel/super.c
          grep -Fq 'ext2-$(CONFIG_EXT2_FS_XATTR) += mbcache.o' native/filesystems/ext2/kernel/Makefile
          ! grep -Fq 'ext2-y += mbcache.o' native/filesystems/ext2/kernel/Makefile

          copy_tree fs/ext4 native/filesystems/ext3/kernel
          # Remove EXT2 registration from the EXT3 copy and remove the EXT4
          # filesystem type entirely. Internal ext4_* names are intentionally
          # retained until later refactoring.
          perl -0pi -e 's/#if !defined\(CONFIG_EXT2_FS\).*?#endif\n\n/#define IS_EXT2_SB(sb) (0)\n\n/s' native/filesystems/ext3/kernel/super.c
          perl -0pi -e 's/static struct file_system_type ext4_fs_type = \{.*?MODULE_ALIAS_FS\("ext4"\);\n//s' native/filesystems/ext3/kernel/super.c
          perl -0pi -e 's/#if !defined\(CONFIG_EXT2_FS\).*?#endif\n\nstatic inline void register_as_ext3\(void\).*?static inline int ext3_feature_set_ok\(struct super_block \*sb\)/static inline int ext2_feature_set_ok(struct super_block *sb) { return 0; }\n\nstatic inline int ext3_feature_set_ok(struct super_block *sb)/s' native/filesystems/ext3/kernel/super.c
          sed -i \
            -e 's/obj-$(CONFIG_EXT4_FS) += ext4.o/obj-m += ext3.o/' \
            -e 's/^ext4-y[[:space:]]*:=/ext3-y :=/' \
            -e 's/^ext4-$(CONFIG_EXT4_FS_POSIX_ACL)/ext3-$(CONFIG_EXT4_FS_POSIX_ACL)/' \
            -e 's/^ext4-$(CONFIG_EXT4_FS_SECURITY)/ext3-$(CONFIG_EXT4_FS_SECURITY)/' \
            -e 's/^ext4-$(CONFIG_FS_VERITY)/ext3-$(CONFIG_FS_VERITY)/' \
            -e 's/^ext4-$(CONFIG_FS_ENCRYPTION)/ext3-$(CONFIG_FS_ENCRYPTION)/' \
            native/filesystems/ext3/kernel/Makefile
          perl -0pi -e 's/\tregister_as_ext3\(\);\n\tregister_as_ext2\(\);\n\terr = register_filesystem\(&ext4_fs_type\);/\terr = register_filesystem\(&ext3_fs_type\);/g' native/filesystems/ext3/kernel/super.c
          perl -0pi -e 's/out:\n\tunregister_as_ext2\(\);\n\tunregister_as_ext3\(\);/out:/g' native/filesystems/ext3/kernel/super.c
          perl -0pi -e 's/\tunregister_as_ext2\(\);\n\tunregister_as_ext3\(\);\n\tunregister_filesystem\(&ext4_fs_type\);/\tunregister_filesystem\(&ext3_fs_type\);/g' native/filesystems/ext3/kernel/super.c
          sed -i '/MODULE_ALIAS_FS("ext4");/d' native/filesystems/ext3/kernel/super.c
          sed -i 's/MODULE_DESCRIPTION("Fourth Extended Filesystem")/MODULE_DESCRIPTION("Third Extended Filesystem")/' native/filesystems/ext3/kernel/super.c
          sed -i '/ext4-inode-test-objs/d; /CONFIG_EXT4_KUNIT_TESTS/d' native/filesystems/ext3/kernel/Makefile
          # EXT3 is a copied implementation, so do not export duplicate ext4_*
          # symbols into the global kernel symbol namespace.
          find native/filesystems/ext3/kernel -maxdepth 1 -type f -name '*.c' -exec sed -i '/^[[:space:]]*EXPORT_SYMBOL/d' {} +
          add_ext34_embedded_support native/filesystems/ext3/kernel ext3

          copy_tree fs/ext4 native/filesystems/ext4/kernel
          # EXT4 must register only EXT4. Strip compatibility registrations.
          perl -0pi -e 's/#if !defined\(CONFIG_EXT2_FS\).*?#endif\n\n\nstatic struct file_system_type ext3_fs_type = \{.*?#define IS_EXT3_SB\(sb\) \(\(sb\)->s_type == &ext3_fs_type\)\n/#define IS_EXT2_SB(sb) (0)\n#define IS_EXT3_SB(sb) (0)\n/s' native/filesystems/ext4/kernel/super.c
          perl -0pi -e 's/#if !defined\(CONFIG_EXT2_FS\).*?#endif\n\nstatic inline void register_as_ext3\(void\).*?static inline int ext3_feature_set_ok\(struct super_block \*sb\)\n\{.*?\n\}/static inline int ext2_feature_set_ok(struct super_block *sb) { return 0; }\nstatic inline int ext3_feature_set_ok(struct super_block *sb) { return 0; }/s' native/filesystems/ext4/kernel/super.c
          sed -i '/^[[:space:]]*register_as_ext3();$/d; /^[[:space:]]*register_as_ext2();$/d; /^[[:space:]]*unregister_as_ext3();$/d; /^[[:space:]]*unregister_as_ext2();$/d' native/filesystems/ext4/kernel/super.c
          sed -i '/MODULE_ALIAS_FS("ext3");/d; /MODULE_ALIAS("ext3");/d' native/filesystems/ext4/kernel/super.c
          sed -i 's/obj-$(CONFIG_EXT4_FS) += ext4.o/obj-m += ext4.o/' native/filesystems/ext4/kernel/Makefile
          sed -i '/ext4-inode-test-objs/d; /CONFIG_EXT4_KUNIT_TESTS/d' native/filesystems/ext4/kernel/Makefile
          add_ext34_embedded_support native/filesystems/ext4/kernel ext4

          copy_tree fs/xfs native/filesystems/xfs/kernel
          copy_tree fs/btrfs native/filesystems/btrfs/kernel
          copy_tree fs/f2fs native/filesystems/f2fs/kernel
          copy_tree fs/jfs native/filesystems/jfs/kernel
          copy_tree fs/nilfs2 native/filesystems/nilfs2/kernel
          copy_tree fs/reiserfs native/filesystems/reiserfs/kernel
          copy_tree fs/erofs native/filesystems/erofs/kernel
          copy_tree fs/minix native/filesystems/minix/kernel
          copy_tree fs/romfs native/filesystems/romfs/kernel
          copy_tree fs/cramfs native/filesystems/cramfs/kernel
          copy_tree fs/squashfs native/filesystems/squashfs/kernel
          copy_tree fs/bcachefs native/filesystems/bcachefs/kernel
          copy_tree fs/overlayfs native/filesystems/overlayfs/kernel
          copy_tree fs/ecryptfs native/filesystems/ecryptfs/kernel
          copy_tree fs/jffs2 native/filesystems/jffs2/kernel
          copy_tree fs/ubifs native/filesystems/ubifs/kernel
          copy_tree fs/zonefs native/filesystems/zonefs/kernel
          copy_tree fs/gfs2 native/filesystems/gfs2/kernel
          copy_tree fs/ocfs2 native/filesystems/ocfs2/kernel
          copy_tree fs/adfs native/filesystems/adfs/kernel
          copy_tree fs/affs native/filesystems/affs/kernel
          copy_tree fs/befs native/filesystems/befs/kernel
          copy_tree fs/bfs native/filesystems/bfs/kernel
          copy_tree fs/efs native/filesystems/efs/kernel
          copy_tree fs/hpfs native/filesystems/hpfs/kernel
          copy_tree fs/qnx4 native/filesystems/qnx4/kernel
          copy_tree fs/qnx6 native/filesystems/qnx6/kernel
          copy_tree fs/sysv native/filesystems/sysv/kernel
          copy_tree fs/ufs native/filesystems/ufs/kernel
          copy_tree fs/omfs native/filesystems/omfs/kernel
          copy_tree fs/fat native/filesystems/fat/kernel
          copy_tree fs/exfat native/filesystems/exfat/kernel
          copy_tree fs/ntfs3 native/filesystems/ntfs3/kernel
          copy_tree fs/hfs native/filesystems/hfs/kernel
          copy_tree fs/hfsplus native/filesystems/hfsplus/kernel
          copy_tree fs/isofs native/filesystems/iso9660/kernel
          copy_tree fs/udf native/filesystems/udf/kernel
          copy_tree fs/fuse native/filesystems/virtiofs/kernel
          rm -rf native/filesystems/cifs/kernel
          mkdir -p native/filesystems/cifs/kernel
          cp -a /tmp/linux/fs/smb/client native/filesystems/cifs/kernel/client
          cp -a /tmp/linux/fs/smb/common native/filesystems/cifs/kernel/common
          copy_tree fs/nfs native/filesystems/nfs/kernel
          copy_tree fs/ceph native/filesystems/cephfs/kernel
          copy_tree fs/9p native/filesystems/9p/kernel
          copy_tree fs/orangefs native/filesystems/orangefs/kernel

      - name: Commit imported sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/import-linux-drivers.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Import working Linux filesystem driver sources"
          git push origin HEAD:main
