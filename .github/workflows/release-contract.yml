name: Release orchestration contract

on:
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - ".github/workflows/apt-publication.yml"
      - ".github/workflows/ext-runtime-qualification.yml"
      - ".github/workflows/amiga-runtime-qualification.yml"
      - ".github/workflows/release-contract.yml"
      - "tests/desktop_manifest_boundary_test.py"
      - "docs/BRITTLENESS_REDUCTION.md"

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify release ownership boundaries
        shell: bash
        run: |
          set -euo pipefail
          build=.github/workflows/build.yml
          apt=.github/workflows/apt-publication.yml
          ext=.github/workflows/ext-runtime-qualification.yml
          amiga=.github/workflows/amiga-runtime-qualification.yml

          test ! -e .github/workflows/release.yml

          # Release promotion lives in the exact build run that created the
          # package.  Runtime evidence is called as reusable exact-SHA work,
          # not rediscovered by workflow name or timing.
          grep -Fq 'uses: ./.github/workflows/ext-runtime-qualification.yml' "$build"
          grep -Fq 'uses: ./.github/workflows/amiga-runtime-qualification.yml' "$build"
          grep -Fq 'uses: actions/download-artifact@v4' "$build"
          grep -Fq 'publish-release:' "$build"
          ! grep -Fq 'workflow_run:' "$build"
          ! grep -Fq 'actions/runs?' "$build"
          ! grep -Fq 'wait_for_workflow' "$build"
          ! grep -Fq 'gh workflow run' "$build"
          ! grep -Fq 'cmake -S . -B build-release' "$build"

          # Runtime workflows expose one explicit immutable-SHA call boundary.
          for workflow in "$ext" "$amiga"; do
            grep -Fq 'workflow_call:' "$workflow"
            grep -Fq 'Exact commit SHA to qualify' "$workflow"
            grep -Fq "inputs.sha" "$workflow"
          done

          # APT is the only remaining asynchronous boundary because the central
          # repository is external to this workflow run.  It follows successful
          # completion of build, which includes GitHub Release publication.
          grep -Fq 'workflows: ["build"]' "$apt"
          ! grep -Fq 'Waiting for GitHub release' "$apt"
          ! grep -Fq 'workflows: ["Publish release"]' "$apt"
