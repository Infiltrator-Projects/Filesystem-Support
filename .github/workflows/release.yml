# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish release

on:
  workflow_run:
    workflows: ["build"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Verify build provenance
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.workflow_run.name }}" = "build"
          test "${{ github.event.workflow_run.event }}" = "push"
          test "${{ github.event.workflow_run.conclusion }}" = "success"

      - name: Check out exact built release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Install release packaging dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev python3

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          head_commit=$(git rev-parse HEAD)
          test "$head_commit" = "$EXPECTED_SHA"

          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          subject=$(git log -1 --format=%s "$head_commit")
          if [[ "$subject" != "Release $version" && "$subject" != "Release $version:"* ]]; then
            echo "Release commit subject must begin with Release $version." >&2
            exit 1
          fi

      - name: Require exact-SHA runtime qualifications
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          wait_for_workflow()
          {
            workflow_name="$1"
            for attempt in $(seq 1 280); do
              state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXPECTED_SHA&per_page=100" \
                --jq --arg name "$workflow_name" \
                '.workflow_runs | map(select(.name == $name)) | first | if . == null then "pending" elif .status == "completed" then .conclusion else .status end')

              if [[ "$state" == success ]]; then
                echo "$workflow_name passed for $EXPECTED_SHA."
                return 0
              fi

              case "$state" in
                failure|cancelled|timed_out|action_required|skipped)
                  echo "$workflow_name did not pass for $EXPECTED_SHA: $state" >&2
                  return 1
                  ;;
              esac

              echo "Waiting for $workflow_name at $EXPECTED_SHA ($attempt/280)..."
              sleep 15
            done

            echo "$workflow_name has not completed for $EXPECTED_SHA; refusing publication." >&2
            return 1
          }

          wait_for_workflow "EXT runtime qualification"
          wait_for_workflow "Amiga runtime qualification"

      - name: Retrieve the package from the triggering build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN_ID" \
            --name filesystem-support-linux-package \
            --dir dist

          version=$(tr -d '[:space:]' < VERSION)
          deb="dist/Filesystem-Support-$version-amd64.deb"
          test "$(dpkg-deb -f "$deb" Package)" = infiltrator-filesystem-support
          test "$(dpkg-deb -f "$deb" Version)" = "$version"
          python3 tests/udisks_display_test.py --package "$deb"
          cp "$deb" .

      - name: Verify the qualified single Debian package
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          deb="Filesystem-Support-$version-amd64.deb"
          test "$(dpkg-deb -f "$deb" Conflicts)" = infiltrator-filesystem-support-udisks
          ! dpkg-deb -f "$deb" Depends | grep -Fq infiltrator-filesystem-support-udisks
          dpkg-deb -c "$deb" > package-contents.txt
          grep -Fq './usr/bin/fsinspect' package-contents.txt
          grep -Fq '/desktop/templates/ofs.so' package-contents.txt
          grep -Fq '/usr/lib/infiltrator-filesystem-support/native-filesystems.tsv' package-contents.txt
          ! grep -Fq '59-infiltrator-filesystems.rules' package-contents.txt
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" = 1

      - name: Build and verify the single-package run installer
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          run="Filesystem-Support-$version-amd64.run"
          ./packaging/build-run.sh "Filesystem-Support-$version-amd64.deb" "$run"
          test -x "$run"
          help=$("./$run" --help)
          grep -Fq '/usr/bin/fsinspect' <<<"$help"
          grep -Fq 'per-filesystem desktop templates' <<<"$help"
          grep -Fq 'project-native Amiga filesystems' <<<"$help"

      - name: Generate checksums
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          sha256sum \
            "Filesystem-Support-$version-amd64.deb" \
            "Filesystem-Support-$version-amd64.run" \
            > RELEASE_SHA256SUMS.txt

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          tag="v$version"
          deb="Filesystem-Support-$version-amd64.deb"
          run="Filesystem-Support-$version-amd64.run"

          git fetch origin --tags
          head_commit=$(git rev-parse HEAD)
          test "$head_commit" = "$EXPECTED_SHA"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_commit=$(git rev-list -n 1 "$tag")
            test "$tag_commit" = "$EXPECTED_SHA" || {
              echo "Tag $tag does not point at the tested release commit." >&2
              exit 1
            }
          else
            git tag "$tag" "$EXPECTED_SHA"
            git push origin "$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            target=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.target_commitish')
            test "$target" = "$EXPECTED_SHA" || {
              echo "Release $tag targets $target instead of $EXPECTED_SHA." >&2
              exit 1
            }

            expected=$(printf '%s\n%s\n%s\n' "$deb" "$run" RELEASE_SHA256SUMS.txt | sort)
            actual=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
            test "$actual" = "$expected" || {
              echo "Release $tag exists with a different asset set." >&2
              exit 1
            }

            published=$(mktemp -d)
            trap 'rm -rf "$published"' EXIT
            gh release download "$tag" --dir "$published" \
              --pattern "$deb" \
              --pattern "$run" \
              --pattern RELEASE_SHA256SUMS.txt
            cmp "$deb" "$published/$deb"
            cmp "$run" "$published/$run"
            cmp RELEASE_SHA256SUMS.txt "$published/RELEASE_SHA256SUMS.txt"
            echo "Release $tag already exists and exactly matches the qualified artifacts."
            exit 0
          fi

          cat > release-notes.md <<EOF
          Filesystem Support $version.

          Debian-first filesystem support manager for real persistent local-storage filesystem formats.

          Highlights:
          - Common 1.19.38-backed portable primitives and InfiltratorOS-aligned responsive GTK interface
          - project-native EXT2, EXT3, EXT4, OFS, FFS, SFS, SFS2 and PFS3 Linux modules managed against the running kernel
          - runtime-qualified read/write paths for EXT2/EXT3/EXT4 and OFS/FFS/SFS/SFS2; PFS3 remains intentionally read-only
          - real Amiga media identification for OFS, FFS, SFS, SFS2 and PFS3 through the project-owned fsinspect detector
          - canonical format validation, including AFFS midpoint root/checksum validation rather than signature-only matching
          - udev/UDisks ID_FS_* publication so Amiga volumes are detected by desktop disk tooling even though stock libblkid lacks these recognisers
          - automatic module loading and safe desktop mount policy, with PFS3 forced read-only
          - each Install/Remove action deploys/removes that filesystem’s own driver, identification rule and Disks naming file together
          - one main Debian package with inactive per-filesystem desktop templates; no supplemental Debian package
          - installer-time udev reload/retrigger so already-connected Amiga media is re-identified without a reboot
          - one qualified Debian package, also embedded in the native .run installer, with no additional desktop Debian package
          - independent runtime qualification for EXT and Amiga implementations with host filesystem implementations disabled where applicable

          Release assets:
          - Generic AMD64 Debian package
          - Native self-extracting .run installer
          - SHA-256 checksum manifest

          GitHub also provides immutable source code ZIP and TAR.GZ archives for this tag.
          EOF

          gh release create "$tag" \
            "$deb" \
            "$run" \
            RELEASE_SHA256SUMS.txt \
            --verify-tag \
            --target "$EXPECTED_SHA" \
            --title "Filesystem Support $version" \
            --notes-file release-notes.md \
            --latest

          expected=$(printf '%s\n%s\n%s\n' "$deb" "$run" RELEASE_SHA256SUMS.txt | sort)
          actual=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          test "$actual" = "$expected"

      - name: Withdraw retired desktop packages and their dependent installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packaging/retire-desktop-package.py
