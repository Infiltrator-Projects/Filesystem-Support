# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish release

on:
  workflow_run:
    workflows: ["EXT runtime qualification"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify runtime qualification provenance
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.workflow_run.name }}" = "EXT runtime qualification"
          test "${{ github.event.workflow_run.conclusion }}" = "success"

      - name: Check out exact tested release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Install release build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libgtk-3-dev \
            dpkg-dev policykit-1 udev libudisks2-0

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          test "$head_commit" = "$EXPECTED_SHA"
          test "$main_commit" = "$EXPECTED_SHA"

          version=$(tr -d '[:space:]' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          subject=$(git log -1 --format=%s "$head_commit")
          if [[ "$subject" != "Release $version" && "$subject" != "Release $version:"* ]]; then
            echo "Release commit subject must begin with Release $version." >&2
            exit 1
          fi

      - name: Retrieve the desktop client qualified for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXPECTED_SHA&per_page=100" \
            --jq '.workflow_runs | map(select(.name == "build" and .conclusion == "success")) | first | .id // empty')
          test -n "$build_run"
          gh run download "$build_run" --name filesystem-support-desktop-client --dir dist
          version=$(tr -d '[:space:]' < VERSION)
          desktop="dist/infiltrator-filesystem-support-udisks_${version}_amd64.deb"
          test "$(dpkg-deb -f "$desktop" Package)" = infiltrator-filesystem-support-udisks
          test "$(dpkg-deb -f "$desktop" Version)" = "$version"
          python3 tests/udisks_display_test.py --package "$desktop"
          cp "$desktop" .

      - name: Configure, build and test
        run: |
          set -euo pipefail
          cmake -S . -B build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build-release
          ctest --test-dir build-release --output-on-failure

      - name: Build and verify Debian package
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          cpack --config build-release/CPackConfig.cmake -G DEB -B dist
          deb="dist/Filesystem-Support-$version-amd64.deb"
          test -f "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "infiltrator-filesystem-support"
          test "$(dpkg-deb -f "$deb" Version)" = "$version"
          dpkg-deb -f "$deb" Depends | grep -Eq '(^|, )udev([ ,]|$)'
          dpkg-deb -f "$deb" Depends | grep -Fq "infiltrator-filesystem-support-udisks (>= $version)"
          dpkg-deb -c "$deb" > package-contents.txt
          grep -Fq './usr/bin/fsinspect' package-contents.txt
          grep -Fq './usr/lib/udev/rules.d/59-infiltrator-filesystems.rules' package-contents.txt
          cp "$deb" .

      - name: Build and verify native run installer
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          run="Filesystem-Support-$version-amd64.run"
          ./packaging/build-run.sh build-release/filesystem-support "$run" \
            "infiltrator-filesystem-support-udisks_${version}_amd64.deb"
          test -x "$run"
          help=$("./$run" --help)
          grep -Fq '/usr/bin/fsinspect' <<<"$help"
          grep -Fq '59-infiltrator-filesystems.rules' <<<"$help"
          grep -Fq 'SFS2/PFS3' <<<"$help"
          grep -Fq 'infiltrator-filesystem-support-udisks' <<<"$help"

      - name: Generate checksums
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          sha256sum \
            "Filesystem-Support-$version-amd64.deb" \
            "Filesystem-Support-$version-amd64.run" \
            "infiltrator-filesystem-support-udisks_${version}_amd64.deb" \
            > RELEASE_SHA256SUMS.txt

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          tag="v$version"
          deb="Filesystem-Support-$version-amd64.deb"
          run="Filesystem-Support-$version-amd64.run"
          desktop="infiltrator-filesystem-support-udisks_${version}_amd64.deb"

          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          test "$head_commit" = "$EXPECTED_SHA"
          test "$main_commit" = "$EXPECTED_SHA"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_commit=$(git rev-list -n 1 "$tag")
            test "$tag_commit" = "$EXPECTED_SHA" || {
              echo "Tag $tag does not point at the tested release commit." >&2
              exit 1
            }
          else
            git tag "$tag" "$EXPECTED_SHA"
            git push origin "$tag"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; published releases are immutable." >&2
            exit 1
          fi

          cat > release-notes.md <<EOF
          Filesystem Support $version.

          Debian-first filesystem support manager with 109 filesystem and storage-namespace targets catalogued.

          Highlights:
          - Common 1.19.38-backed portable primitives and InfiltratorOS-aligned responsive GTK interface
          - project-native EXT2, EXT3, EXT4, OFS, FFS, SFS, SFS2 and PFS3 Linux modules managed against the running kernel
          - runtime-qualified read/write paths for EXT2/EXT3/EXT4 and OFS/FFS/SFS/SFS2; PFS3 remains intentionally read-only
          - real Amiga media identification for OFS, FFS, SFS, SFS2 and PFS3 through the project-owned fsinspect detector
          - canonical format validation, including AFFS midpoint root/checksum validation rather than signature-only matching
          - udev/UDisks ID_FS_* publication so Amiga volumes are detected by desktop disk tooling even though stock libblkid lacks these recognisers
          - automatic module loading and safe desktop mount policy, with PFS3 forced read-only
          - proper Amiga OFS/FFS/SFS/SFS2/PFS3 names in GNOME Disks Contents and the volume map through a private Disks display extension that preserves stock libudisks2-0
          - installer-time udev reload/retrigger so already-connected Amiga media is re-identified without a reboot
          - matching detector, udev rule and all eight native filesystem source payloads in both the Debian package and native .run installer
          - independent runtime qualification for EXT and Amiga implementations with host filesystem implementations disabled where applicable

          Release assets:
          - Generic AMD64 Debian package
          - Native self-extracting .run installer
          - Private GNOME Disks display extension (installed as a dependency)
          - SHA-256 checksum manifest

          GitHub also provides immutable source code ZIP and TAR.GZ archives for this tag.
          EOF

          gh release create "$tag" \
            "$deb" \
            "$run" \
            "$desktop" \
            RELEASE_SHA256SUMS.txt \
            --verify-tag \
            --target "$EXPECTED_SHA" \
            --title "Filesystem Support $version" \
            --notes-file release-notes.md \
            --latest

          expected=$(printf '%s\n%s\n%s\n%s\n' "$deb" "$run" "$desktop" RELEASE_SHA256SUMS.txt | sort)
          actual=$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)
          test "$actual" = "$expected"
