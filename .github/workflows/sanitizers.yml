name: sanitizer and adversarial qualification

on:
  push:
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "native/**"
      - "tools/fsinspect/**"
      - "tests/**"
      - ".github/workflows/sanitizers.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "native/**"
      - "tools/fsinspect/**"
      - "tests/**"
      - ".github/workflows/sanitizers.yml"
  workflow_dispatch:

concurrency:
  group: filesystem-support-sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libudisks2-0 python3

      - name: Configure ASan and UBSan
        run: |
          CC=clang CXX=clang++ cmake -S . -B build-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
            -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' \
            -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined'

      - name: Build sanitized userspace targets
        run: cmake --build build-sanitized

      - name: Run sanitized unit and integration tests
        run: ctest --test-dir build-sanitized --output-on-failure

      - name: Run malformed-media corpus through fsinspect
        run: python3 tests/parser_adversarial_test.py build-sanitized/fsinspect
