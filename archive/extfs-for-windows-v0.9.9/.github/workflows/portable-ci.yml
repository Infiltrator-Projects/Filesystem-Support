# SPDX-License-Identifier: GPL-3.0-or-later
name: Portable ExtFS CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enforce main-only automatic immutable publishing
        shell: bash
        run: |
          set -euo pipefail
          release=.github/workflows/publish-release.yml
          grep -Fq '  workflow_run:' "$release"
          grep -Fq 'workflows: ["Portable ExtFS CI"]' "$release"
          grep -Fq "startsWith(github.event.workflow_run.head_commit.message, 'Release ')" "$release"
          grep -Fq "github.event.workflow_run.head_branch == 'main'" "$release"
          grep -Fq 'published releases are immutable' "$release"
          if grep -Eq '^  workflow_dispatch:|^  pull_request:|^  schedule:' "$release"; then
            echo 'ExtFS release publication must be automatic from tested main only.' >&2
            exit 1
          fi
          test ! -e .github/workflows/publish-arm64-test.yml

      - name: GCC warnings-as-errors and unit tests
        run: |
          make clean
          make all
          ./build/test-extfs
          ./build/test-single-indirect

      - name: Real ext2/ext3/ext4 image qualification
        run: make integration

      - name: Filesystem contract regression checks
        shell: pwsh
        run: .\windows\test\Test-FilesystemContracts.ps1

      - name: CMake and CTest
        run: |
          cmake -S . -B build-cmake
          cmake --build build-cmake
          ctest --test-dir build-cmake --output-on-failure

      - name: ASan and UBSan
        run: |
          make clean
          make all CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' LDFLAGS='-fsanitize=address,undefined'
          ./build/test-extfs
          ./build/test-single-indirect

      - name: Clang warnings-as-errors
        run: |
          make clean
          make all CC=clang
          ./build/test-extfs
          ./build/test-single-indirect

      - name: GCC static analyzer
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -fanalyzer -Iinclude \
              -c core/extfs.c -o /tmp/extfs-fanalyzer.o
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -fanalyzer -Iinclude \
              -c core/extfs_classic_resize.c -o /tmp/extfs-classic-fanalyzer.o
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror -fanalyzer -Iinclude \
              -c core/extfs_resize_dispatch.c -o /tmp/extfs-dispatch-fanalyzer.o

      - name: Clang static analyzer
        run: |
          clang --analyze -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude core/extfs.c
          clang --analyze -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude core/extfs_classic_resize.c
          clang --analyze -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude core/extfs_resize_dispatch.c

      - name: Shell and XML syntax
        shell: bash
        run: |
          bash -n tests/integration.sh windows/build-cross-linux.sh
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('windows/driver/extfs.vcxproj')
          ET.parse('packages.config')
          print('Shell and XML syntax checks passed')
          PY

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $scripts = @(
            'windows/Build-And-Validate.ps1',
            'windows/Build-ExperimentalSetup.ps1',
            'windows/installer/Install-ExtFS.ps1',
            'windows/installer/Uninstall-ExtFS.ps1',
            'windows/test/Test-ExtFS.ps1',
            'windows/test/Test-FilesystemContracts.ps1',
            'windows/test/Collect-Diagnostics.ps1',
            'windows/test/Enable-DriverVerifier.ps1',
            'windows/test/Disable-DriverVerifier.ps1'
          )
          foreach ($script in $scripts) {
            [void][scriptblock]::Create((Get-Content -LiteralPath $script -Raw))
          }
          Write-Host 'PowerShell syntax checks passed'

  local-linux:
    name: Local Linux / native qualification
    runs-on: [self-hosted, Linux, X64, linux-native]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: GCC warnings-as-errors and unit tests
        run: |
          make clean
          make all
          ./build/test-extfs
          ./build/test-single-indirect

      - name: Real ext2/ext3/ext4 image qualification
        run: make integration

      - name: CMake and CTest
        run: |
          rm -rf build-cmake
          cmake -S . -B build-cmake
          cmake --build build-cmake --parallel
          ctest --test-dir build-cmake --output-on-failure

      - name: ASan and UBSan
        run: |
          make clean
          make all CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer' LDFLAGS='-fsanitize=address,undefined'
          ./build/test-extfs
          ./build/test-single-indirect

      - name: Clang warnings-as-errors
        run: |
          make clean
          make all CC=clang
          ./build/test-extfs
          ./build/test-single-indirect
