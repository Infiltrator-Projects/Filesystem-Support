# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish ExtFS release

on:
  workflow_run:
    workflows: ["Portable ExtFS CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: windows-latest
    timeout-minutes: 70
    permissions:
      contents: write
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Resolve exact release source
        id: release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          git fetch origin main --tags
          $head = (git rev-parse HEAD).Trim()
          $main = (git rev-parse origin/main).Trim()
          if ($head -ne $env:EXPECTED_SHA -or $main -ne $env:EXPECTED_SHA) {
              throw "Release source $head is not exact current main $main."
          }
          $version = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Invalid ExtFS package VERSION '$version'."
          }
          $subject = (git log -1 --format=%s $head).Trim()
          if ($subject -ne "Release $version" -and -not $subject.StartsWith("Release ${version}:")) {
              throw "Release commit subject must begin with Release $version."
          }
          $tag = "v$version"
          if (git rev-parse -q --verify "refs/tags/$tag" 2>$null) {
              throw "Release tag $tag already exists; published releases are immutable."
          }
          $existingRelease = (& gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json | Where-Object { $_.tagName -eq $tag })
          if ($existingRelease) { throw "Release $tag already exists; published releases are immutable." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Locate NuGet
        timeout-minutes: 5
        shell: powershell
        run: |
          if (-not (Get-Command nuget.exe -ErrorAction SilentlyContinue)) {
              choco install nuget.commandline -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "Chocolatey NuGet install failed with exit code $LASTEXITCODE." }
          }

      - name: Ensure full WDK validation tools
        timeout-minutes: 15
        shell: powershell
        run: |
          $inf2cat = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Filter Inf2Cat.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $inf2cat) {
              $winget = Get-Command winget.exe -ErrorAction Stop
              & $winget.Source install --source winget --exact --id Microsoft.WindowsWDK.10.0.28000 --accept-package-agreements --accept-source-agreements --silent --disable-interactivity
              if ($LASTEXITCODE -ne 0) { throw "WDK WinGet installation failed with exit code $LASTEXITCODE." }
              $inf2cat = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Filter Inf2Cat.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $inf2cat) { throw 'Full WDK installed but Inf2Cat.exe is still unavailable.' }

      - name: Ensure NSIS
        timeout-minutes: 5
        shell: powershell
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'NSIS\makensis.exe')) -and -not (Test-Path -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'))) {
              choco install nsis -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "Chocolatey NSIS install failed with exit code $LASTEXITCODE." }
          }

      - name: Build and verify x64 and ARM64 installers
        timeout-minutes: 35
        shell: powershell
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          foreach ($platform in @('x64','ARM64')) {
              .\windows\Build-ExperimentalSetup.ps1 -Platform $platform
              $slug = if ($platform -eq 'ARM64') { 'arm64' } else { 'x64' }
              $setup = "ExtFS-for-Windows-$env:VERSION-experimental-$slug-setup.exe"
              if (-not (Test-Path -LiteralPath $setup)) { throw "Expected installer not produced: $setup" }
              $fileVersion = (Get-Item -LiteralPath $setup).VersionInfo.FileVersion
              if (-not $fileVersion.StartsWith("$env:VERSION.")) { throw "Installer version mismatch: $fileVersion" }
          }
          .\windows\test\Test-InstallerContract.ps1
          .\windows\test\Test-FilesystemContracts.ps1

      - name: Build source archive and checksums
        shell: powershell
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $source = "ExtFS-for-Windows-$env:VERSION-source.zip"
          git archive --format=zip --output=$source HEAD
          if (-not (Test-Path -LiteralPath $source)) { throw 'Source archive was not created.' }
          $assets = @(
              "ExtFS-for-Windows-$env:VERSION-experimental-x64-setup.exe",
              "ExtFS-for-Windows-$env:VERSION-experimental-arm64-setup.exe",
              $source
          )
          $lines = foreach ($asset in $assets) {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
              "$hash  $asset"
          }
          $lines | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii

      - name: Publish immutable release
        timeout-minutes: 5
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          git fetch origin main --tags
          $head = (git rev-parse HEAD).Trim()
          $main = (git rev-parse origin/main).Trim()
          if ($head -ne $env:EXPECTED_SHA -or $main -ne $env:EXPECTED_SHA) { throw 'main moved after release verification.' }
          if (git rev-parse -q --verify "refs/tags/$env:TAG" 2>$null) { throw "Release tag $env:TAG already exists; published releases are immutable." }
          $existingRelease = (& gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json | Where-Object { $_.tagName -eq $env:TAG })
          if ($existingRelease) { throw "Release $env:TAG already exists; published releases are immutable." }

          git tag $env:TAG $head
          git push origin $env:TAG

          $x64 = "ExtFS-for-Windows-$env:VERSION-experimental-x64-setup.exe"
          $arm64 = "ExtFS-for-Windows-$env:VERSION-experimental-arm64-setup.exe"
          $source = "ExtFS-for-Windows-$env:VERSION-source.zip"
          & gh release create $env:TAG $x64 $arm64 $source SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $head --title "Ext Filesystem Driver $env:VERSION" --notes "Automatic release from tested exact current main."
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }

          $assets = & gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
          foreach ($expected in @($x64,$arm64,$source,'SHA256SUMS.txt')) {
              if ($assets -notcontains $expected) { throw "Published release is missing $expected" }
          }
