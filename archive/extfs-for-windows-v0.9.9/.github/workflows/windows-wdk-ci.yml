# SPDX-License-Identifier: GPL-3.0-or-later
name: Windows WDK package CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: windows-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            slug: x64
          - platform: ARM64
            slug: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify installer contracts
        shell: powershell
        run: .\windows\test\Test-InstallerContract.ps1

      - name: Verify filesystem contracts
        shell: powershell
        run: .\windows\test\Test-FilesystemContracts.ps1

      - name: Locate NuGet
        timeout-minutes: 5
        shell: powershell
        run: |
          $nuget = Get-Command nuget.exe -ErrorAction SilentlyContinue
          if (-not $nuget) {
              choco install nuget.commandline -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "Chocolatey NuGet install failed with exit code $LASTEXITCODE." }
              $nuget = Get-Command nuget.exe -ErrorAction Stop
          }
          Write-Host "NuGet: $($nuget.Source)"

      - name: Ensure full WDK validation tools
        timeout-minutes: 15
        shell: powershell
        run: |
          $inf2cat = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Filter Inf2Cat.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $inf2cat) {
              $winget = Get-Command winget.exe -ErrorAction Stop
              & $winget.Source install --source winget --exact --id Microsoft.WindowsWDK.10.0.28000 --accept-package-agreements --accept-source-agreements --silent --disable-interactivity
              if ($LASTEXITCODE -ne 0) { throw "WDK WinGet installation failed with exit code $LASTEXITCODE." }
              $inf2cat = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10" -Filter Inf2Cat.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $inf2cat) { throw 'Full WDK installed but Inf2Cat.exe is still unavailable.' }
          Write-Host "Inf2Cat: $($inf2cat.FullName)"

      - name: Ensure NSIS
        timeout-minutes: 5
        shell: powershell
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'NSIS\makensis.exe')) -and -not (Test-Path -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'))) {
              choco install nsis -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "Chocolatey NSIS install failed with exit code $LASTEXITCODE." }
          }

      - name: Build, analyse, sign, verify and assemble installer
        timeout-minutes: 25
        shell: powershell
        run: |
          $platform = '${{ matrix.platform }}'
          $slug = '${{ matrix.slug }}'
          $packageVersion = (Get-Content -LiteralPath 'VERSION' -Raw).Trim()
          if ($packageVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid package VERSION '$packageVersion'." }
          .\windows\Build-ExperimentalSetup.ps1 -Platform $platform
          $setup = "ExtFS-for-Windows-$packageVersion-experimental-$slug-setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "Expected installer not produced: $setup" }
          $version = (Get-Item -LiteralPath $setup).VersionInfo.FileVersion
          $expectedVersion = "$packageVersion.0"
          if ($version -ne $expectedVersion) { throw "Installer version mismatch: expected $expectedVersion, found '$version'." }
          $driverVer = Get-Content -LiteralPath 'release\driver\extfs.inf' | Where-Object { $_ -match '^\s*DriverVer\s*=' } | Select-Object -First 1
          if (($driverVer -replace '\s', '') -ne 'DriverVer=08/20/2026,0.9.3.0') { throw "Staged INF version mismatch: '$driverVer'." }
          $report = Get-Content -LiteralPath 'release\driver\build-report.txt' -Raw
          if ($report -notmatch "(?m)^Platform: $([regex]::Escape($platform))\r?$") { throw 'Build report platform mismatch.' }
          if ($report -notmatch "(?m)^PackageVersion: $([regex]::Escape($packageVersion))\r?$") { throw 'Package-version evidence is missing.' }
          if ($report -notmatch "(?m)^FinalArchitecture: $([regex]::Escape($platform))\r?$") { throw 'Final package architecture evidence is missing.' }
          Write-Host "Installer SHA-256: $((Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash)"

      - name: Upload package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extfs-wdk-package-${{ matrix.slug }}
          path: |
            ExtFS-for-Windows-*-experimental-${{ matrix.slug }}-setup.exe
            release/driver/build-report.txt
            release/driver/extfs.inf
          if-no-files-found: ignore
